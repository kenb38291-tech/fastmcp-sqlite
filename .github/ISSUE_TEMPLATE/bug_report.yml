name: "🐛 Bug Report"
description: "Report an issue or unexpected behavior in fastmcp-sqlite"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting an issue! Please provide as much detail as possible to help us reproduce and fix it."
  - type: input
    id: version
    attributes:
      label: "fastmcp-sqlite Version"
      placeholder: "e.g. 1.0.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "Environment (OS & Python Version)"
      placeholder: "e.g. Windows 11 / Ubuntu 24.04, Python 3.12"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Provide the query or command that triggered the problem."
      placeholder: "1. Run fastmcp-sqlite with ...\n2. Execute query ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual Output / Error Log"
    validations:
      required: true
