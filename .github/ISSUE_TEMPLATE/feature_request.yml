name: "✨ Feature Request"
description: "Suggest a new idea or enhancement for fastmcp-sqlite"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Thank you for suggesting an idea to make fastmcp-sqlite better!"
  - type: textarea
    id: problem
    attributes:
      label: "Problem or Limitation"
      description: "Is your feature request related to a specific limitation or pain point?"
      placeholder: "A clear and concise description of the problem..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: "Describe what you would like to happen and how it adheres to our architectural invariants."
      placeholder: "A clear and concise description of what you want to happen..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternative Approaches"
      description: "Describe any alternative solutions or features you've considered."
