<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" style="background:#06070A;font-family:'Geist Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Master Gradients with LinearRGB Color Interpolation -->
    <linearGradient id="swissAccentV2" x1="0%" y1="0%" x2="100%" y2="100%" color-interpolation="linearRGB">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="bladeCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3754" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1E2438" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0F1320" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Precise 8pt / 16pt Background Grid Pattern -->
    <pattern id="swissGrid8pt" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#0E111C" stroke-width="1"/>
      <circle cx="16" cy="16" r="0.75" fill="#1A2033"/>
    </pattern>

    <!-- Hard Edge Multi-Stage Drop Shadow -->
    <filter id="crispShadowV2" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Kinetic Glow Filter -->
    <filter id="kineticGlow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>

    <!-- Central Radial Atmosphere -->
    <radialGradient id="centralAtmosphere" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.14"/>
      <stop offset="45%" stop-color="#06B6D4" stop-opacity="0.06"/>
      <stop offset="85%" stop-color="#06070A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base Layer -->
  <rect width="512" height="512" fill="#06070A"/>
  <rect width="512" height="512" fill="url(#centralAtmosphere)"/>
  <rect width="512" height="512" fill="url(#swissGrid8pt)"/>

  <!-- Outer Swiss Coordinate & Telemetry Calibration Marks -->
  <g fill="#475569" font-family="'Geist Mono','JetBrains Mono',monospace" font-size="8.5" font-weight="600" letter-spacing="1.5">
    <text x="24" y="32">SYS.02 // SWISS MONOGRAM V2</text>
    <text x="408" y="32">512×512 · 8PT</text>
    <line x1="24" y1="40" x2="488" y2="40" stroke="#131722" stroke-width="1"/>
    
    <text x="24" y="484">RATIO: 1.618 φ · ZERO-DEP</text>
    <text x="406" y="484">OKLCH: P3-WIDE</text>
    <line x1="24" y1="468" x2="488" y2="468" stroke="#131722" stroke-width="1"/>
  </g>

  <!-- G2 Continuous Squircle Container (App Icon Tile) -->
  <g transform="translate(64, 64)" filter="url(#crispShadowV2)">
    <!-- Base Squircle Surface Ladder -->
    <rect x="0" y="0" width="384" height="384" rx="88" fill="#0B0D14" stroke="#181D2C" stroke-width="2"/>
    <rect x="2" y="2" width="380" height="380" rx="86" fill="none" stroke="url(#cardBorder)" stroke-width="1.5"/>

    <!-- Subtle Diagonal 45° Engineering Baseline Slices -->
    <line x1="24" y1="360" x2="360" y2="24" stroke="#151A29" stroke-width="1.5" stroke-dasharray="4 8"/>
    <line x1="24" y1="24" x2="360" y2="360" stroke="#111520" stroke-width="1" stroke-dasharray="2 10"/>

    <!-- Concentric Inner Registration Frame -->
    <rect x="40" y="40" width="304" height="304" rx="60" fill="none" stroke="#161C2C" stroke-width="1" stroke-dasharray="6 6"/>

    <!-- SWISS MONOGRAM ICON CORE -->
    <g transform="translate(64, 60)">
      <!-- 1. Database Foundation Tier 2 (Negative Space Base) -->
      <path d="M 32 180 C 32 214, 224 214, 224 180 L 224 212 C 224 246, 32 246, 32 212 Z" fill="#111624" stroke="#1E273F" stroke-width="2"/>
      <ellipse cx="128" cy="180" rx="96" ry="24" fill="#0C101B" stroke="#25304C" stroke-width="2"/>

      <!-- 2. Monolithic Lettermark 'F' - Top Horizontal Rail (Golden Ratio Length 188px) -->
      <rect x="36" y="36" width="188" height="28" rx="6" fill="#FFFFFF"/>

      <!-- 3. Monolithic Lettermark 'F' - Mid Horizontal Rail (120px) -->
      <rect x="36" y="100" width="120" height="28" rx="6" fill="#FFFFFF"/>

      <!-- 4. Monolithic Vertical Spine (Connecting Top Rail to Database Disc) -->
      <rect x="36" y="36" width="32" height="196" rx="6" fill="#FFFFFF"/>

      <!-- 5. Dynamic 45° Kinetic Chevron Speed Blade (FastMCP Velocity Metaphor) -->
      <polygon points="180,68 228,68 148,228 100,228" fill="url(#swissAccentV2)" filter="url(#kineticGlow)"/>
      <polygon points="176,78 212,78 144,218 108,218" fill="url(#bladeCore)" opacity="0.95"/>

      <!-- 6. Quantum Optical Convergence Dot (Geometric Focal Point) -->
      <circle cx="160" cy="148" r="6" fill="#00F0FF" filter="url(#kineticGlow)"/>
      <circle cx="160" cy="148" r="2.5" fill="#FFFFFF"/>

      <!-- 7. Swiss Vernier Caliper & Ratio Calibration Ticks (Right Margin) -->
      <g stroke="#38BDF8" stroke-width="1.5" opacity="0.6">
        <line x1="236" y1="36" x2="246" y2="36"/>
        <line x1="236" y1="64" x2="241" y2="64"/>
        <line x1="236" y1="100" x2="246" y2="100"/>
        <line x1="236" y1="128" x2="241" y2="128"/>
        <line x1="236" y1="164" x2="241" y2="164"/>
        <line x1="236" y1="180" x2="246" y2="180"/>
        <line x1="236" y1="212" x2="246" y2="212"/>
        <line x1="236" y1="232" x2="241" y2="232"/>
      </g>
      
      <!-- Coordinate Labels on Caliper -->
      <text x="252" y="40" fill="#64748B" font-family="'Geist Mono',monospace" font-size="7" font-weight="600">0.00</text>
      <text x="252" y="104" fill="#64748B" font-family="'Geist Mono',monospace" font-size="7" font-weight="600">0.38</text>
      <text x="252" y="184" fill="#64748B" font-family="'Geist Mono',monospace" font-size="7" font-weight="600">0.76</text>
      <text x="252" y="216" fill="#10B981" font-family="'Geist Mono',monospace" font-size="7" font-weight="700">1.00</text>
    </g>

    <!-- Sub-label Typography in Pure Swiss Neo-Grotesque Tracking -->
    <g transform="translate(192, 336)" text-anchor="middle">
      <text x="0" y="0" fill="#F8FAFC" font-size="12" font-weight="800" letter-spacing="4">
        FASTMCP · SQLITE
      </text>
      <text x="0" y="16" fill="#06B6D4" font-family="'Geist Mono',monospace" font-size="8.5" font-weight="700" letter-spacing="2.5">
        SUB-20MS COLD START · WAL
      </text>
    </g>
  </g>

  <!-- Corner Crosshair Optical Alignment Targets -->
  <g stroke="#334155" stroke-width="1">
    <path d="M 16 24 L 24 24 M 20 20 L 20 28"/>
    <path d="M 488 24 L 496 24 M 492 20 L 492 28"/>
    <path d="M 16 488 L 24 488 M 20 484 L 20 492"/>
    <path d="M 488 488 L 496 488 M 492 484 L 492 492"/>
  </g>
</svg>