<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#030509;font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI','Geist Mono',Roboto,sans-serif;">
  <defs>
    <!-- ======================================================== -->
    <!-- 1. COLOR GRADIENT DEFINITIONS (OKLCH-TUNED MULTI-STOP)   -->
    <!-- ======================================================== -->
    
    <!-- Deep Cosmos Atmosphere Base -->
    <radialGradient id="h-spaceAura" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#0e172e" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#0a1022" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#050811" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020307" stop-opacity="1"/>
    </radialGradient>

    <!-- Aurora Horizon Fluid Core Swirl -->
    <radialGradient id="h-auroraCore" cx="48%" cy="58%" r="55%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.45"/>
      <stop offset="25%" stop-color="#06B6D4" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.25"/>
      <stop offset="75%" stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#030509" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="h-amberHorizon" cx="62%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.4"/>
      <stop offset="30%" stop-color="#EC4899" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#4C1D95" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#030509" stop-opacity="0"/>
    </radialGradient>

    <!-- Multi-Chromatic Fluid Splash Stream -->
    <linearGradient id="h-fluidStreamMain" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="20%" stop-color="#10B981"/>
      <stop offset="40%" stop-color="#06B6D4"/>
      <stop offset="60%" stop-color="#3B82F6"/>
      <stop offset="80%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <linearGradient id="h-fluidStreamWarm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="30%" stop-color="#6366F1"/>
      <stop offset="70%" stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <linearGradient id="h-glassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="h-emeraldFacet" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#065F46" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#022C22" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="h-amberGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>

    <linearGradient id="h-badgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.4"/>
    </linearGradient>

    <!-- ======================================================== -->
    <!-- 2. SHADER FILTERS (ANALOG FILM GRAIN, DISPLACEMENT, GLOW) -->
    <!-- ======================================================== -->

    <!-- Analog Film Grain Shader Texture -->
    <filter id="h-filmGrain" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch" result="grainNoise"/>
      <feColorMatrix type="saturate" values="0" in="grainNoise" result="desatGrain"/>
      <feComponentTransfer in="desatGrain" result="subtleGrain">
        <feFuncA type="table" tableValues="0 0.11"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="subtleGrain" mode="overlay"/>
    </filter>

    <!-- Organic Fluid Soft Mist Blur -->
    <filter id="h-auroraBlur" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="45"/>
    </filter>

    <!-- Hyper-Luminous Glow Filter -->
    <filter id="h-hyperGlow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="20" result="blurMain"/>
      <feGaussianBlur stdDeviation="6" result="blurSharp"/>
      <feMerge>
        <feMergeNode in="blurMain"/>
        <feMergeNode in="blurSharp"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Deep Drop Shadow -->
    <filter id="h-monolithShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- ======================================================== -->
  <!-- 3. CANVAS BACKGROUND & HORIZON LIGHT SCATTER             -->
  <!-- ======================================================== -->
  <rect width="1280" height="720" fill="url(#h-spaceAura)"/>

  <!-- Celestial Coordinate Engineering Grid -->
  <g stroke="#38BDF8" stroke-opacity="0.035" stroke-width="1">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
    <line x1="160" y1="0" x2="160" y2="720"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
    <line x1="1120" y1="0" x2="1120" y2="720"/>
  </g>

  <!-- Atmospheric Nebular Glow Clouds -->
  <ellipse cx="600" cy="380" rx="580" ry="290" fill="url(#h-auroraCore)"/>
  <ellipse cx="780" cy="440" rx="460" ry="240" fill="url(#h-amberHorizon)"/>

  <!-- ======================================================== -->
  <!-- 4. ORGANIC HORIZON FLUID SPLASH (PREFECT-INSPIRED FLOW) -->
  <!-- ======================================================== -->
  
  <!-- Deep Translucent Fluid Wave Base -->
  <g opacity="0.65" filter="url(#h-auroraBlur)">
    <!-- Primary Fluid Arc 1 -->
    <path d="M-80,480 C 180,260 380,660 680,420 C 980,180 1140,560 1380,360 L 1380,720 L -80,720 Z" fill="url(#h-fluidStreamMain)"/>
    
    <!-- Secondary Harmonizing Splatter Wave -->
    <path d="M-40,560 C 260,380 500,690 820,490 C 1080,330 1200,600 1340,480 L 1340,720 L -40,720 Z" fill="url(#h-fluidStreamWarm)" opacity="0.75"/>
    
    <!-- High-Chroma Cyan Splash Tongue -->
    <path d="M120,640 C 350,440 520,320 740,460 C 940,580 1120,410 1260,510 L 1260,720 L 120,720 Z" fill="#00F0FF" opacity="0.35"/>
  </g>

  <!-- Crisp Handcrafted Fluid Silk Ribbons (Surface Tensions) -->
  <g opacity="0.8">
    <!-- Fluid Wave Ribbon 1 (Emerald to Indigo) -->
    <path d="M-60,490 C 200,310 410,640 710,430 C 990,220 1160,530 1360,370" fill="none" stroke="url(#h-fluidStreamMain)" stroke-width="6" stroke-linecap="round" filter="url(#h-hyperGlow)"/>
    <path d="M-60,490 C 200,310 410,640 710,430 C 990,220 1160,530 1360,370" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.8" stroke-linecap="round"/>

    <!-- Fluid Wave Ribbon 2 (Cyan to Radiant Amber) -->
    <path d="M-20,570 C 280,410 520,670 830,510 C 1070,360 1190,580 1320,490" fill="none" stroke="url(#h-fluidStreamWarm)" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>
    
    <!-- Harmonic Counter-Wave Accent Ribbon -->
    <path d="M40,360 C 310,540 580,290 860,470 C 1040,580 1180,440 1300,380" fill="none" stroke="#00F0FF" stroke-width="1.8" stroke-dasharray="8 14" opacity="0.5"/>
    <path d="M160,630 C 440,470 690,620 960,440 C 1120,330 1220,420 1290,390" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 10" opacity="0.65"/>
  </g>

  <!-- Orbital Tokenomics Flux Rings (Model Context Protocol Metaphor) -->
  <g transform="translate(640, 315) rotate(-16)">
    <ellipse cx="0" cy="0" rx="360" ry="96" fill="none" stroke="url(#h-fluidStreamMain)" stroke-width="1.8" stroke-dasharray="14 10" opacity="0.55"/>
    <ellipse cx="0" cy="0" rx="410" ry="112" fill="none" stroke="#00F0FF" stroke-width="1" stroke-dasharray="6 18" opacity="0.35"/>
    <ellipse cx="0" cy="0" rx="310" ry="80" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.65" filter="url(#h-hyperGlow)"/>

    <!-- Kinetic Memory Map Micro-Particles -->
    <circle cx="310" cy="20" r="4.5" fill="#FFFFFF" filter="url(#h-hyperGlow)"/>
    <circle cx="-260" cy="-35" r="3.5" fill="#00F0FF" filter="url(#h-hyperGlow)"/>
    <circle cx="110" cy="76" r="3" fill="#10B981" filter="url(#h-hyperGlow)"/>
    <circle cx="-130" cy="72" r="3.5" fill="#F59E0B" filter="url(#h-hyperGlow)"/>
  </g>

  <!-- ======================================================== -->
  <!-- 5. CENTERPIECE: PRISMATIC SQLITE DATABASE ENGINE         -->
  <!-- ======================================================== -->
  <g transform="translate(640, 290)" filter="url(#h-monolithShadow)">
    <!-- Top Cap Ellipse Facet (Prismatic Window) -->
    <polygon points="0,-125 115,-58 0,10 -115,-58" fill="url(#h-glassSheen)"/>

    <!-- Left Cyan Glass Facet -->
    <polygon points="-115,-58 0,10 0,145 -115,77" fill="url(#h-glassSheen)" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.7"/>

    <!-- Right Emerald Glass Facet -->
    <polygon points="0,10 115,-58 115,77 0,145" fill="url(#h-emeraldFacet)" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.85"/>

    <!-- Database Disc Tier Partition Grooves -->
    <path d="M -115, -12 L 0, 56 L 115, -12" fill="none" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.6" stroke-dasharray="4 4"/>
    <path d="M -115, 34 L 0, 102 L 115, 34" fill="none" stroke="#10B981" stroke-width="1" stroke-opacity="0.7" stroke-dasharray="4 4"/>

    <!-- Internal Glowing WAL Core (Atomic Engine Spark) -->
    <ellipse cx="0" cy="10" rx="38" ry="18" fill="#FFFFFF" opacity="0.95" filter="url(#h-hyperGlow)"/>
    <ellipse cx="0" cy="10" rx="18" ry="8" fill="#00F0FF" filter="url(#h-hyperGlow)"/>

    <!-- SQLite Precision Feather / Kinetic Speed Chevron -->
    <polygon points="12,-40 38,-40 -12,65 -38,65" fill="url(#h-amberGlow)" filter="url(#h-hyperGlow)"/>

    <!-- Laser Axis Center Beam -->
    <line x1="0" y1="-85" x2="0" y2="105" stroke="#FFFFFF" stroke-width="2.5" filter="url(#h-hyperGlow)"/>

    <!-- Precision Edge Reflection Highlights -->
    <line x1="-115" y1="-58" x2="0" y2="10" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    <line x1="0" y1="10" x2="115" y2="-58" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- ======================================================== -->
  <!-- 6. FOREGROUND BRAND IDENTITY & TECHNICAL TELEMETRY       -->
  <!-- ======================================================== -->
  <g transform="translate(640, 550)" text-anchor="middle">
    <!-- Brand Wordmark -->
    <text x="0" y="0" font-size="46" font-weight="900" letter-spacing="-0.8" fill="#FFFFFF">
      fastmcp<tspan fill="#10B981">-sqlite</tspan>
    </text>

    <!-- Refined Architectural Subtitle -->
    <text x="0" y="36" font-size="14" font-weight="600" fill="#94A3B8" letter-spacing="3.5">
      HORIZON FLUID VELOCITY · ZERO OVERHEAD · ACID WAL ENGINE
    </text>

    <!-- Technical Telemetry Badge Pill Cluster -->
    <g transform="translate(0, 72)">
      <!-- Badge 1: 0ms Native Compilers -->
      <g transform="translate(-230, 0)">
        <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#090E1A" stroke="url(#h-badgeBorder)" stroke-width="1.2"/>
        <circle cx="-65" cy="0" r="4" fill="#10B981" filter="url(#h-hyperGlow)"/>
        <text x="6" y="4.5" font-family="'Geist Mono', 'Inter', monospace" font-size="10.5" font-weight="700" fill="#34D399" letter-spacing="1">ZERO TOOLCHAIN</text>
      </g>

      <!-- Badge 2: Memory-Mapped 256MB -->
      <g transform="translate(0, 0)">
        <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#090E1A" stroke="url(#h-badgeBorder)" stroke-width="1.2"/>
        <circle cx="-65" cy="0" r="4" fill="#00F0FF" filter="url(#h-hyperGlow)"/>
        <text x="6" y="4.5" font-family="'Geist Mono', 'Inter', monospace" font-size="10.5" font-weight="700" fill="#38BDF8" letter-spacing="1">MMAP 256MB WAL</text>
      </g>

      <!-- Badge 3: Opcode Watchdog -->
      <g transform="translate(230, 0)">
        <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#090E1A" stroke="url(#h-badgeBorder)" stroke-width="1.2"/>
        <circle cx="-65" cy="0" r="4" fill="#F59E0B" filter="url(#h-hyperGlow)"/>
        <text x="6" y="4.5" font-family="'Geist Mono', 'Inter', monospace" font-size="10.5" font-weight="700" fill="#FBBF24" letter-spacing="1">WATCHDOG &lt;5MS</text>
      </g>
    </g>
  </g>

  <!-- Ambient Micro-Star Constellation Points -->
  <g opacity="0.75">
    <circle cx="210" cy="160" r="1.5" fill="#38BDF8" filter="url(#h-hyperGlow)"/>
    <circle cx="1060" cy="190" r="2" fill="#10B981" filter="url(#h-hyperGlow)"/>
    <circle cx="140" cy="440" r="1.5" fill="#8B5CF6"/>
    <circle cx="1140" cy="470" r="2.5" fill="#00F0FF" filter="url(#h-hyperGlow)"/>
    <circle cx="340" cy="620" r="1.2" fill="#F59E0B"/>
    <circle cx="940" cy="110" r="1.8" fill="#FFFFFF"/>
  </g>

  <!-- ======================================================== -->
  <!-- 7. ANALOG FILM GRAIN TACTILE OVERLAY                     -->
  <!-- ======================================================== -->
  <rect width="1280" height="720" filter="url(#h-filmGrain)" opacity="0.32" pointer-events="none"/>
</svg>