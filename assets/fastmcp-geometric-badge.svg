<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" style="background:#06070A;font-family:'Geist Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Master Gradients -->
    <linearGradient id="badgeAccent" x1="0%" y1="0%" x2="100%" y2="100%" color-interpolation="linearRGB">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="hexFacetTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#121D33"/>
      <stop offset="100%" stop-color="#1B2B4C"/>
    </linearGradient>

    <linearGradient id="hexFacetLeft" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#142138"/>
    </linearGradient>

    <linearGradient id="hexFacetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A101C"/>
      <stop offset="100%" stop-color="#10192B"/>
    </linearGradient>

    <!-- Precise Hexagonal Dot Grid -->
    <pattern id="hexGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#151C2C"/>
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#0E1320" stroke-width="0.75"/>
    </pattern>

    <!-- Multi-Stage Deep Badge Shadow -->
    <filter id="badgeShadow" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.95"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Kinetic Glow Filter -->
    <filter id="badgeGlow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>

    <!-- Radial Emerald Aura -->
    <radialGradient id="badgeAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.06"/>
      <stop offset="85%" stop-color="#06070A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base Layer -->
  <rect width="512" height="512" fill="#06070A"/>
  <rect width="512" height="512" fill="url(#badgeAura)"/>
  <rect width="512" height="512" fill="url(#hexGrid)"/>

  <!-- Outer Swiss Telemetry Border & Coordinate Stamps -->
  <g fill="#475569" font-family="'Geist Mono',monospace" font-size="8.5" font-weight="600" letter-spacing="1.5">
    <text x="24" y="32">HEX.01 // ACID INTEGRITY BADGE</text>
    <text x="396" y="32">ZERO-DEP · C89</text>
    <line x1="24" y1="40" x2="488" y2="40" stroke="#131826" stroke-width="1"/>
    
    <text x="24" y="484">PRAGMA WAL · MMAP 256MB</text>
    <text x="408" y="484">MCP v1.0.0</text>
    <line x1="24" y1="468" x2="488" y2="468" stroke="#131826" stroke-width="1"/>
  </g>

  <!-- MASTER GEOMETRIC HEXAGONAL BADGE CONTAINER -->
  <g filter="url(#badgeShadow)">
    <!-- 1. Outer Heavy Hexagon Shield Frame (R=196, r=169.74) -->
    <!-- Vertices: (256,60), (426,158), (426,354), (256,452), (86,354), (86,158) -->
    <polygon points="256,58 428,157 428,355 256,454 84,355 84,157" fill="#0A0E18" stroke="#1F2A40" stroke-width="2.5"/>

    <!-- 2. Concentric Hairline Hexagon Inset 1 (R=184) -->
    <polygon points="256,72 416,164 416,348 256,440 96,348 96,164" fill="none" stroke="#2A3854" stroke-width="1" stroke-dasharray="6 4" opacity="0.6"/>

    <!-- 3. Isometric Polyhedral Facets (3 Interlocking Rhombus Planes) -->
    <!-- Center Node: (256, 256) -->
    <!-- Top Rhombus: (256,76) -> (410,165) -> (256,256) -> (102,165) -->
    <polygon points="256,76 410,165 256,256 102,165" fill="url(#hexFacetTop)" stroke="#23324E" stroke-width="1.5"/>

    <!-- Left Rhombus: (102,165) -> (256,256) -> (256,436) -> (102,347) -->
    <polygon points="102,165 256,256 256,436 102,347" fill="url(#hexFacetLeft)" stroke="#23324E" stroke-width="1.5"/>

    <!-- Right Rhombus: (410,165) -> (256,256) -> (256,436) -> (410,347) -->
    <polygon points="410,165 256,256 256,436 410,347" fill="url(#hexFacetRight)" stroke="#23324E" stroke-width="1.5"/>

    <!-- 4. ACID 4-Quadrant Geometric Pillar Nodes -->
    <!-- Pillar A (Atomicity) Top Left -->
    <g transform="translate(148, 140)">
      <circle cx="0" cy="0" r="14" fill="#0C1424" stroke="#10B981" stroke-width="1.8"/>
      <text x="0" y="4.5" text-anchor="middle" fill="#FFFFFF" font-family="'Geist Mono',monospace" font-size="11" font-weight="800">A</text>
    </g>

    <!-- Pillar C (Consistency) Top Right -->
    <g transform="translate(364, 140)">
      <circle cx="0" cy="0" r="14" fill="#0C1424" stroke="#06B6D4" stroke-width="1.8"/>
      <text x="0" y="4.5" text-anchor="middle" fill="#FFFFFF" font-family="'Geist Mono',monospace" font-size="11" font-weight="800">C</text>
    </g>

    <!-- Pillar I (Isolation) Bottom Left -->
    <g transform="translate(148, 372)">
      <circle cx="0" cy="0" r="14" fill="#0C1424" stroke="#3B82F6" stroke-width="1.8"/>
      <text x="0" y="4.5" text-anchor="middle" fill="#FFFFFF" font-family="'Geist Mono',monospace" font-size="11" font-weight="800">I</text>
    </g>

    <!-- Pillar D (Durability) Bottom Right -->
    <g transform="translate(364, 372)">
      <circle cx="0" cy="0" r="14" fill="#0C1424" stroke="#A855F7" stroke-width="1.8"/>
      <text x="0" y="4.5" text-anchor="middle" fill="#FFFFFF" font-family="'Geist Mono',monospace" font-size="11" font-weight="800">D</text>
    </g>

    <!-- 5. Central Database Master Core (Discs + Kinetic Lightning) -->
    <g transform="translate(176, 186)">
      <!-- Database Base Disc -->
      <path d="M 10 75 C 10 95, 150 95, 150 75 L 150 95 C 150 115, 10 115, 10 95 Z" fill="#0C1322" stroke="#223048" stroke-width="1.5"/>
      <ellipse cx="80" cy="75" rx="70" ry="20" fill="#131D30" stroke="#334768" stroke-width="1.5"/>

      <!-- Database Top Disc -->
      <path d="M 10 38 C 10 58, 150 58, 150 38 L 150 55 C 150 75, 10 75, 10 55 Z" fill="#172744" stroke="#10B981" stroke-width="2"/>
      <ellipse cx="80" cy="38" rx="70" ry="20" fill="#0B1220" stroke="#10B981" stroke-width="2" filter="url(#badgeGlow)"/>
      <ellipse cx="80" cy="38" rx="50" ry="14" fill="none" stroke="#00F0FF" stroke-width="1" stroke-dasharray="4 3"/>

      <!-- Dynamic Kinetic Lightning Bolt -->
      <polygon points="105,4 62,72 88,72 48,138 122,60 94,60" fill="url(#badgeAccent)" filter="url(#badgeGlow)"/>
      <polygon points="100,12 68,68 86,68 58,126 112,64 92,64" fill="#FFFFFF" opacity="0.95"/>
    </g>

    <!-- 6. Top & Bottom Swiss Ribbon Badges -->
    <!-- Top Header Ribbon -->
    <g transform="translate(256, 108)" text-anchor="middle">
      <rect x="-84" y="-12" width="168" height="24" rx="12" fill="#0B1322" stroke="#1E2E48" stroke-width="1.5"/>
      <text x="0" y="4" fill="#38BDF8" font-family="'Geist Mono',monospace" font-size="9" font-weight="800" letter-spacing="2">
        ACID COMPLIANT
      </text>
    </g>

    <!-- Bottom Footer Ribbon -->
    <g transform="translate(256, 404)" text-anchor="middle">
      <rect x="-92" y="-12" width="184" height="24" rx="12" fill="#0B1322" stroke="#1E2E48" stroke-width="1.5"/>
      <text x="0" y="4" fill="#10B981" font-family="'Geist Mono',monospace" font-size="9" font-weight="800" letter-spacing="2">
        ZERO-DEPENDENCY
      </text>
    </g>
  </g>

  <!-- Corner Crosshairs -->
  <g stroke="#334155" stroke-width="1">
    <path d="M 16 24 L 24 24 M 20 20 L 20 28"/>
    <path d="M 488 24 L 496 24 M 492 20 L 492 28"/>
    <path d="M 16 488 L 24 488 M 20 484 L 20 492"/>
    <path d="M 488 488 L 496 488 M 492 484 L 492 492"/>
  </g>
</svg>