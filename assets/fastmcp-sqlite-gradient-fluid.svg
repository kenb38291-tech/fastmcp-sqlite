<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#030407;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Geist Mono','Inter',sans-serif;">
  <defs>
    <!-- Rich Multi-Stop Mesh Gradients -->
    <radialGradient id="nebulaCore" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="25%" stop-color="#06B6D4" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.2"/>
      <stop offset="75%" stop-color="#4C1D95" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#030407" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="horizonGlow" cx="50%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#7C3AED" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#030407" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="fluidStream1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="40%" stop-color="#06B6D4"/>
      <stop offset="80%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="crystalFacet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#06B6D4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="crystalFacet2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="crystalTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Blur & Glow Filters -->
    <filter id="hyperGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softMist" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Deep Cosmos Canvas -->
  <rect width="1280" height="720" fill="#030407"/>

  <!-- Fluid Background Glow Clouds -->
  <ellipse cx="640" cy="360" rx="550" ry="320" fill="url(#nebulaCore)"/>
  <ellipse cx="640" cy="620" rx="600" ry="180" fill="url(#horizonGlow)"/>

  <!-- Ethereal Flowing Plasma Waves (Background Organic Fluid Layer) -->
  <g opacity="0.45" filter="url(#softMist)">
    <path d="M-100,500 C 200,300 400,650 700,450 C 1000,250 1150,550 1400,400 L 1400,720 L -100,720 Z" fill="url(#fluidStream1)"/>
    <path d="M-50,600 C 300,450 550,680 850,520 C 1100,380 1250,580 1350,500 L 1350,720 L -50,720 Z" fill="#06B6D4" opacity="0.5"/>
  </g>

  <!-- Orbital Token Flux Rings (MCP & Tokenomics Metaphor) -->
  <g transform="translate(640, 330) rotate(-18)">
    <ellipse cx="0" cy="0" rx="340" ry="90" fill="none" stroke="url(#fluidStream1)" stroke-width="2" stroke-dasharray="16 12" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="380" ry="105" fill="none" stroke="#00F0FF" stroke-width="1.2" stroke-dasharray="6 18" opacity="0.4"/>
    <ellipse cx="0" cy="0" rx="300" ry="75" fill="none" stroke="#10B981" stroke-width="1.8" opacity="0.7" filter="url(#hyperGlow)"/>

    <!-- Kinetic Token Particles -->
    <circle cx="280" cy="20" r="5" fill="#FFFFFF" filter="url(#hyperGlow)"/>
    <circle cx="-240" cy="-35" r="4" fill="#00F0FF" filter="url(#hyperGlow)"/>
    <circle cx="90" cy="72" r="3.5" fill="#10B981" filter="url(#hyperGlow)"/>
  </g>

  <!-- CENTERPIECE: CRYSTALLINE DATABASE MONOLITH (Faceted Glass SQLite Engine) -->
  <g transform="translate(640, 310)" filter="url(#hyperGlow)">
    <!-- Top Cap Ellipse Facet -->
    <polygon points="0,-120 110,-55 0,10 -110,-55" fill="url(#crystalTop)"/>

    <!-- Left Glass Facet -->
    <polygon points="-110,-55 0,10 0,140 -110,75" fill="url(#crystalFacet1)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.6"/>

    <!-- Right Emerald Glass Facet -->
    <polygon points="0,10 110,-55 110,75 0,140" fill="url(#crystalFacet2)" stroke="#10B981" stroke-width="1" stroke-opacity="0.8"/>

    <!-- Internal Glowing Core (SQLite WAL Core & Watchdog Engine) -->
    <ellipse cx="0" cy="10" rx="35" ry="16" fill="#FFFFFF" opacity="0.95" filter="url(#hyperGlow)"/>
    <line x1="0" y1="-80" x2="0" y2="100" stroke="#00F0FF" stroke-width="3" filter="url(#hyperGlow)"/>

    <!-- Prismatic Reflection Highlights -->
    <line x1="-110" y1="-55" x2="0" y2="10" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <line x1="0" y1="10" x2="110" y2="-55" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- FOREGROUND BRAND TYPOGRAPHY & FLOATING METADATA -->
  <g transform="translate(640, 560)" text-anchor="middle">
    <!-- Main Floating Title -->
    <text x="0" y="0" font-size="44" font-weight="800" letter-spacing="-0.5" fill="#FFFFFF">
      fastmcp<tspan fill="#10B981">-sqlite</tspan>
    </text>

    <!-- Refined Subtitle -->
    <text x="0" y="36" font-size="16" font-weight="500" fill="#94A3B8" letter-spacing="3">
      FLUID VELOCITY · REFINED TOKENOMICS · ZERO RESISTANCE
    </text>

    <!-- Floating Technical Micro-Tokens -->
    <g transform="translate(0, 75)" font-size="11" font-weight="600" letter-spacing="1.5" fill="#64748B">
      <text x="-240" y="0">MMAP 256MB</text>
      <text x="-80" y="0">●</text>
      <text x="0" y="0">WAL CONCURRENCY</text>
      <text x="80" y="0">●</text>
      <text x="240" y="0">OPCODE WATCHDOG</text>
    </g>
  </g>

  <!-- Ambient Light Sparks -->
  <circle cx="280" cy="180" r="1.5" fill="#38BDF8" opacity="0.8"/>
  <circle cx="1020" cy="220" r="2" fill="#10B981" opacity="0.7"/>
  <circle cx="180" cy="420" r="1.5" fill="#A855F7" opacity="0.6"/>
  <circle cx="1100" cy="480" r="2.5" fill="#00F0FF" opacity="0.9"/>
</svg>
