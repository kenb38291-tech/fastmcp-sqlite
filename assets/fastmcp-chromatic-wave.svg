<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" style="background:#020409;font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI','Geist Mono',Roboto,sans-serif;">
  <defs>
    <!-- Multi-Chromatic OKLCH Silk Gradients -->
    <linearGradient id="w-ribbon1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#10B981" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#A855F7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="w-ribbon2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#06B6D4" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#3B82F6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="w-ribbon3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#8B5CF6" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#00F0FF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="w-ribbonBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00F0FF" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#818CF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </linearGradient>

    <!-- Deep Ambient Glow Radial Gradients -->
    <radialGradient id="w-deepAura" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0b152d" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#070c1a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#020409" stop-opacity="1"/>
    </radialGradient>

    <radialGradient id="w-coreSplash" cx="52%" cy="46%" r="45%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#06B6D4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#020409" stop-opacity="0"/>
    </radialGradient>

    <!-- Shader Filters -->
    <filter id="w-grain" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="desat"/>
      <feComponentTransfer in="desat" result="alphaNoise">
        <feFuncA type="table" tableValues="0 0.12"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="alphaNoise" mode="overlay"/>
    </filter>

    <filter id="w-silkGlow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="16" result="blurWide"/>
      <feGaussianBlur stdDeviation="4" result="blurTight"/>
      <feMerge>
        <feMergeNode in="blurWide"/>
        <feMergeNode in="blurTight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="w-mist" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
  </defs>

  <!-- Obsidian Canvas Base -->
  <rect width="1280" height="640" fill="url(#w-deepAura)"/>
  <ellipse cx="640" cy="320" rx="540" ry="260" fill="url(#w-coreSplash)"/>

  <!-- Precision Digital Calibration Grid -->
  <g stroke="#38BDF8" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="160" y1="0" x2="160" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="800" y1="0" x2="800" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
    <line x1="1120" y1="0" x2="1120" y2="640"/>
  </g>

  <!-- ======================================================== -->
  <!-- SUPERIMPOSED SINUSOIDAL BÉZIER CHROMATIC SILK WAVES       -->
  <!-- ======================================================== -->

  <!-- Volumetric Deep Ambient Fluid Wave Bands -->
  <g opacity="0.45" filter="url(#w-mist)">
    <!-- Deep Wave 1 -->
    <path d="M-100,240 C 220,120 440,480 720,280 C 1000,80 1180,440 1380,260 L 1380,640 L -100,640 Z" fill="url(#w-ribbon1)"/>
    <!-- Deep Wave 2 -->
    <path d="M-60,360 C 260,520 540,160 840,380 C 1060,540 1200,240 1360,420 L 1360,640 L -60,640 Z" fill="url(#w-ribbon2)"/>
  </g>

  <!-- Luminous Flow Ribbon Beams (40px Soft Strokes) -->
  <g opacity="0.7">
    <path d="M-80,290 C 200,160 460,460 740,290 C 1020,120 1180,420 1360,280" fill="none" stroke="url(#w-ribbonBeam)" stroke-width="48" stroke-linecap="round" filter="url(#w-mist)"/>
    <path d="M-40,380 C 280,510 520,190 820,370 C 1060,510 1190,260 1340,390" fill="none" stroke="url(#w-ribbon3)" stroke-width="32" stroke-linecap="round" filter="url(#w-mist)"/>
  </g>

  <!-- Handcrafted Pure Vector Silk Strands (Laser Sharp Harmonic Ribbons) -->
  <g filter="url(#w-silkGlow)">
    <!-- Silk Wave Harmonic 1 -->
    <path d="M-100,270 C 180,140 420,440 700,270 C 980,100 1160,410 1380,250" fill="none" stroke="url(#w-ribbon1)" stroke-width="5" stroke-linecap="round"/>
    <path d="M-100,270 C 180,140 420,440 700,270 C 980,100 1160,410 1380,250" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.85" stroke-linecap="round"/>

    <!-- Silk Wave Harmonic 2 (Phase Shift +35px) -->
    <path d="M-80,305 C 200,175 440,475 720,305 C 1000,135 1180,445 1360,285" fill="none" stroke="url(#w-ribbon2)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

    <!-- Silk Wave Harmonic 3 (Counter Phase Resonance) -->
    <path d="M-60,370 C 240,510 510,180 810,360 C 1050,500 1180,240 1360,380" fill="none" stroke="url(#w-ribbon3)" stroke-width="4" stroke-linecap="round"/>
    <path d="M-60,370 C 240,510 510,180 810,360 C 1050,500 1180,240 1360,380" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.75" stroke-linecap="round"/>

    <!-- Silk Wave Harmonic 4 (Secondary Ripple) -->
    <path d="M-40,405 C 260,545 530,215 830,395 C 1070,535 1200,275 1340,415" fill="none" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" opacity="0.75"/>

    <!-- Micro-Strand Harmonics (Dashed Precision Waves) -->
    <path d="M-80,240 C 220,110 460,410 740,240 C 1020,70 1200,380 1360,220" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.6"/>
    <path d="M-60,430 C 270,560 560,250 860,420 C 1080,550 1210,310 1350,440" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="4 8" opacity="0.65"/>
    <path d="M-100,340 C 190,220 450,500 730,340 C 1000,180 1170,470 1380,320" fill="none" stroke="#C084FC" stroke-width="1.2" stroke-dasharray="14 16" opacity="0.5"/>
  </g>

  <!-- Kinetic Data Tokens along the Wave Crests -->
  <g filter="url(#w-silkGlow)">
    <circle cx="180" cy="140" r="5" fill="#FFFFFF"/>
    <circle cx="420" cy="440" r="4" fill="#00F0FF"/>
    <circle cx="700" cy="270" r="5.5" fill="#10B981"/>
    <circle cx="980" cy="100" r="4.5" fill="#EC4899"/>
    <circle cx="1160" cy="410" r="4" fill="#F59E0B"/>
    <circle cx="240" cy="510" r="4" fill="#8B5CF6"/>
    <circle cx="510" cy="180" r="4.5" fill="#38BDF8"/>
    <circle cx="810" cy="360" r="5" fill="#FFFFFF"/>
  </g>

  <!-- ======================================================== -->
  <!-- BRAND IDENTITY & HUD HEADER / FOOTER                     -->
  <!-- ======================================================== -->

  <!-- Top Navigation Header -->
  <g transform="translate(60, 56)">
    <!-- Mini SQLite Emblem Disc -->
    <g transform="translate(0, -12)">
      <rect width="44" height="44" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
      <ellipse cx="22" cy="16" rx="14" ry="4.5" fill="#38BDF8" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1.2"/>
      <path d="M 8 16 V 26 C 8 29, 36 29, 36 26 V 16" fill="none" stroke="#818CF8" stroke-width="1.2"/>
      <path d="M 8 26 V 34 C 8 37, 36 37, 36 34 V 26" fill="none" stroke="#C084FC" stroke-width="1.2"/>
      <polygon points="23,16 17,27 22,27 20,33 27,23 22,23" fill="#F59E0B"/>
    </g>

    <text x="56" y="10" font-size="22" font-weight="900" letter-spacing="-0.5" fill="#FFFFFF">
      fastmcp<tspan fill="#10B981">-sqlite</tspan>
    </text>
    <text x="56" y="27" font-family="'Geist Mono', 'Inter', monospace" font-size="10.5" font-weight="700" fill="#38BDF8" letter-spacing="2">
      CHROMATIC HARMONICS · VECTOR SILK DYNAMICS
    </text>
  </g>

  <!-- Top Right Engineering Metadata -->
  <g transform="translate(970, 56)" text-anchor="end" font-family="'Geist Mono', monospace" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1.5">
    <text x="250" y="8"><tspan fill="#34D399">● STDLIB SQLITE3</tspan> · <tspan fill="#38BDF8">WAL CONCURRENCY</tspan></text>
    <text x="250" y="26">ZERO NATIVE TOOLCHAIN · MMAP 256MB</text>
  </g>

  <!-- Center-Bottom Floating Technical Metric Cluster -->
  <g transform="translate(640, 565)" text-anchor="middle">
    <!-- Glass Telemetry Pill -->
    <rect x="-340" y="-22" width="680" height="44" rx="22" fill="#070C18" fill-opacity="0.85" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="-338" y="-20" width="676" height="42" rx="21" fill="none" stroke="url(#w-ribbon1)" stroke-width="1" stroke-opacity="0.3"/>

    <g font-family="'Geist Mono', 'Inter', monospace" font-size="11.5" font-weight="700" letter-spacing="1">
      <text x="-210" y="5" fill="#38BDF8">&lt;20MS COLD START</text>
      <text x="-90" y="5" fill="#475569">|</text>
      <text x="0" y="5" fill="#34D399">O(1) SCHEMA DISCOVERY</text>
      <text x="90" y="5" fill="#475569">|</text>
      <text x="210" y="5" fill="#FBBF24">WATCHDOG ABORT &lt;5MS</text>
    </g>
  </g>

  <!-- Tactile Analog Film Grain Layer -->
  <rect width="1280" height="640" filter="url(#w-grain)" opacity="0.3" pointer-events="none"/>
</svg>