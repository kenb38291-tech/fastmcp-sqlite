<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" style="background-color: #080a0c; font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif;">
  <defs>
    <!-- Dark Surface Subtle Dot Pattern -->
    <pattern id="dot-matrix" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.75" fill="#1e293b" opacity="0.8"/>
    </pattern>
    
    <!-- Linear 1px Hairline Border Gradient -->
    <linearGradient id="hairline-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Squircle Subtle Top-Down Sheen (1-2% Opacity Matte) -->
    <linearGradient id="squircle-matte" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2127"/>
      <stop offset="100%" stop-color="#0f1317"/>
    </linearGradient>

    <!-- Cyan/Electric Accent Gradient -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="#080a0c"/>
  <rect width="1200" height="400" fill="url(#dot-matrix)"/>

  <!-- Outer Editorial Framing Box with 1px Hairline Border -->
  <rect x="40" y="40" width="1120" height="320" rx="12" fill="#0b0e11" fill-opacity="0.7" stroke="url(#hairline-stroke)" stroke-width="1"/>

  <!-- Top Metadata Bar -->
  <g id="header-meta" fill="#64748b" font-family="'JetBrains Mono', 'Berkeley Mono', monospace" font-size="9" letter-spacing="1.2">
    <text x="70" y="75" text-transform="uppercase">IDENTITY SYSTEM // LINEAR TECHNICAL BRANDMARK</text>
    <text x="600" y="75" text-anchor="middle" fill="#334155">• • •</text>
    <text x="1130" y="75" text-anchor="end" fill="#38bdf8">SCALE: 1:1 HORIZONTAL LOCKUP</text>
    <line x1="70" y1="90" x2="1130" y2="90" stroke="#1e293b" stroke-width="0.75"/>
  </g>

  <!-- Left: The Iconic App Icon / Squircle Emblem -->
  <g id="brandmark-icon-container" transform="translate(100, 120)">
    <!-- Squircle Base with Continuous Curvature (G2) -->
    <rect x="0" y="0" width="160" height="160" rx="40" fill="url(#squircle-matte)" stroke="url(#hairline-stroke)" stroke-width="1.2"/>

    <!-- Subtle Inner Highlight Rim -->
    <rect x="2" y="2" width="156" height="156" rx="38" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.08"/>

    <!-- Emblem Geometry: Database Cylinder + Lightning Intersection -->
    <!-- Top Database Platter (Ellipse) -->
    <ellipse cx="80" cy="56" rx="44" ry="14" fill="#161d24" stroke="#94a3b8" stroke-width="1.5"/>
    <ellipse cx="80" cy="56" rx="28" ry="8.5" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.7"/>

    <!-- Middle Database Platter -->
    <path d="M 36 84 C 36 96 124 96 124 84" fill="none" stroke="#64748b" stroke-width="1.5"/>
    
    <!-- Bottom Database Platter -->
    <path d="M 36 112 C 36 124 124 124 124 112" fill="none" stroke="#475569" stroke-width="1.5"/>
    
    <!-- Vertical Structural Walls -->
    <line x1="36" y1="56" x2="36" y2="112" stroke="#475569" stroke-width="1.5"/>
    <line x1="124" y1="56" x2="124" y2="112" stroke="#475569" stroke-width="1.5"/>

    <!-- Pure Minimalist Lightning Notch (O(1) Execution Bridge) -->
    <polygon points="85,38 65,82 81,82 73,124 99,76 83,76" fill="url(#accent-cyan)"/>

    <!-- Status Sub-pixel Dot -->
    <circle cx="138" cy="22" r="3" fill="#10b981"/>
  </g>

  <!-- Divider Line -->
  <line x1="310" y1="125" x2="310" y2="275" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Right: Master Typography Lockup -->
  <g id="brandmark-typography" transform="translate(360, 140)">
    <!-- Primary Logotype: "fastmcp" in Neue Haas Grotesk Style -->
    <text x="0" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-size="64" font-weight="700" fill="#f8fafc" letter-spacing="-0.04em">
      fastmcp<tspan fill="#38bdf8" font-weight="300">-</tspan><tspan fill="#94a3b8" font-weight="400" font-family="'JetBrains Mono', 'Berkeley Mono', monospace" font-size="56" letter-spacing="-0.02em">sqlite</tspan>
    </text>

    <!-- Subtitle & Technical Attributes -->
    <text x="2" y="112" font-family="'Inter', sans-serif" font-size="14" font-weight="400" fill="#94a3b8" letter-spacing="0.02em">
      High-Performance Model Context Protocol Server for SQLite
    </text>

    <!-- Technical Badges / Pill Tags -->
    <g transform="translate(0, 130)">
      <!-- Badge 1: Zero-Dependency -->
      <rect x="0" y="0" width="132" height="22" rx="4" fill="#161d24" stroke="#1e293b" stroke-width="1"/>
      <text x="66" y="14.5" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">ZERO_DEPENDENCY</text>

      <!-- Badge 2: O(1) Schema -->
      <rect x="142" y="0" width="94" height="22" rx="4" fill="#161d24" stroke="#1e293b" stroke-width="1"/>
      <text x="189" y="14.5" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8" text-anchor="middle">O(1) ENGINE</text>

      <!-- Badge 3: WAL Mode -->
      <rect x="246" y="0" width="80" height="22" rx="4" fill="#161d24" stroke="#1e293b" stroke-width="1"/>
      <text x="286" y="14.5" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981" text-anchor="middle">WAL_ASYNC</text>

      <!-- Badge 4: Watchdog Guard -->
      <rect x="336" y="0" width="108" height="22" rx="4" fill="#161d24" stroke="#1e293b" stroke-width="1"/>
      <text x="390" y="14.5" font-family="'JetBrains Mono', monospace" font-size="9" fill="#f59e0b" text-anchor="middle">WATCHDOG_SAFE</text>
    </g>
  </g>

  <!-- Bottom Coordinates & Registration Details -->
  <g id="footer-meta" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="8.5" letter-spacing="0.5">
    <line x1="70" y1="315" x2="1130" y2="315" stroke="#1e293b" stroke-width="0.75"/>
    <text x="70" y="335">SYS_CANVAS // 1200x400 [24-BIT MONOCHROME / OKLCH TOKENS]</text>
    <text x="1130" y="335" text-anchor="end" fill="#64748b">CUBIC_BEZIER_CONTINUITY: G2 // ANTI-AI-SLOP_VERIFIED</text>
  </g>
</svg>
