<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradients -->
    <radialGradient id="holo-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0c1e36"/>
      <stop offset="45%" stop-color="#070e1b"/>
      <stop offset="100%" stop-color="#03060a"/>
    </radialGradient>

    <radialGradient id="hex-glow" cx="70%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradients -->
    <linearGradient id="neon-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="neon-violet-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="terminal-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111c2e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0a101d" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="hologram-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#00f2fe" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Canvas Base for GitHub Dark Mode -->
  <rect width="600" height="600" fill="url(#holo-bg)" rx="36"/>
  <rect width="600" height="600" fill="url(#hex-glow)" rx="36"/>

  <!-- Holographic Hexagonal Grid Matrix -->
  <g stroke="#00f2fe" stroke-opacity="0.08" stroke-width="1.2" fill="none">
    <!-- Row 1 -->
    <polygon points="100,50 130,33 160,50 160,84 130,101 100,84"/>
    <polygon points="170,50 200,33 230,50 230,84 200,101 170,84"/>
    <polygon points="240,50 270,33 300,50 300,84 270,101 240,84"/>
    <polygon points="310,50 340,33 370,50 370,84 340,101 310,84"/>
    <polygon points="380,50 410,33 440,50 440,84 410,101 380,84"/>
    <polygon points="450,50 480,33 510,50 510,84 480,101 450,84"/>
    <!-- Row 2 -->
    <polygon points="135,110 165,93 195,110 195,144 165,161 135,144"/>
    <polygon points="205,110 235,93 265,110 265,144 235,161 205,144"/>
    <polygon points="275,110 305,93 335,110 335,144 305,161 275,144"/>
    <polygon points="345,110 375,93 405,110 405,144 375,161 345,144"/>
    <polygon points="415,110 445,93 475,110 475,144 445,161 415,144"/>
    <!-- Laser Perspective Cones -->
    <line x1="0" y1="300" x2="600" y2="300" stroke-dasharray="6 8"/>
    <line x1="300" y1="0" x2="300" y2="600" stroke-dasharray="6 8"/>
  </g>

  <!-- ======================================================== -->
  <!-- CENTRAL HOLOGRAPHIC TERMINAL CONTAINER                   -->
  <!-- ======================================================== -->
  <g transform="translate(45, 45)" filter="url(#subtle-shadow)">
    <!-- Terminal Window Frame -->
    <rect width="510" height="510" rx="24" fill="url(#terminal-glass)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6"/>
    <rect x="4" y="4" width="502" height="502" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>

    <!-- Terminal Header -->
    <rect width="510" height="48" rx="24" fill="#0f172a" fill-opacity="0.8"/>
    <rect y="30" width="510" height="18" fill="#0f172a" fill-opacity="0.8"/>
    <line x1="0" y1="48" x2="510" y2="48" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Mac-Style Window Dots -->
    <circle cx="28" cy="24" r="5.5" fill="#ef4444" opacity="0.85"/>
    <circle cx="46" cy="24" r="5.5" fill="#f59e0b" opacity="0.85"/>
    <circle cx="64" cy="24" r="5.5" fill="#10b981" opacity="0.85"/>

    <text x="95" y="29" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">fastmcp-sqlite.mcp.v1.0.0 [STDIO]</text>

    <!-- Top-Right Pulse Radar -->
    <circle cx="475" cy="24" r="5" fill="#00f2fe" filter="url(#hologram-glow)"/>
    <circle cx="475" cy="24" r="10" fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.5"/>

    <!-- ======================================================== -->
    <!-- TERMINAL INTERIOR: CODE & HOLOGRAPHIC CORE SPLIT        -->
    <!-- ======================================================== -->

    <!-- Left Sub-Pane: SQL & MCP Protocol Stream -->
    <g transform="translate(28, 75)" font-family="'JetBrains Mono', 'Fira Code', monospace">
      <text x="0" y="20" font-size="12" font-weight="700" fill="#38bdf8">// 1. CLIENT QUERY REQUEST</text>
      
      <!-- SQL Syntax Box -->
      <rect x="0" y="32" width="225" height="52" rx="8" fill="#070d18" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="54" font-size="12" fill="#c084fc">SELECT <tspan fill="#f8fafc">name, sql</tspan></text>
      <text x="12" y="72" font-size="12" fill="#c084fc">FROM <tspan fill="#38bdf8">sqlite_master;</tspan></text>

      <text x="0" y="115" font-size="12" font-weight="700" fill="#34d399">// 2. MCP O(1) ENGINE DISCOVERY</text>
      <rect x="0" y="127" width="225" height="98" rx="8" fill="#070d18" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="148" font-size="11" fill="#7dd3fc">→ Probe B-Tree Root</text>
      <text x="12" y="168" font-size="11" fill="#34d399">✓ 42 tables indexed</text>
      <text x="12" y="188" font-size="11" fill="#fbbf24">⚡ Opcode watch: 120/1M</text>
      <text x="12" y="208" font-size="11" fill="#c084fc">✂ 24KB Payload safe</text>
    </g>

    <!-- Right Sub-Pane: Floating 3D Radiant SQLite Cylinder Emblem -->
    <g transform="translate(370, 165)">
      <!-- Pulsing Hexagonal Aura Forcefield -->
      <polygon points="0,-75 65,-37 65,37 0,75 -65,37 -65,-37" fill="none" stroke="url(#neon-cyan-grad)" stroke-width="2" filter="url(#hologram-glow)" opacity="0.6"/>
      <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="none" stroke="url(#neon-violet-grad)" stroke-width="1.2" opacity="0.4"/>

      <!-- 3D Cylinder Core Structure -->
      <!-- Tier 3 -->
      <path d="M -36 30 C -36 45, 36 45, 36 30 V 50 C 36 65, -36 65, -36 50 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
      <ellipse cx="0" cy="30" rx="36" ry="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>

      <!-- Tier 2 -->
      <path d="M -36 0 C -36 15, 36 15, 36 0 V 20 C 36 35, -36 35, -36 20 Z" fill="#0f172a" stroke="#818cf8" stroke-width="1.8"/>
      <ellipse cx="0" cy="0" rx="36" ry="12" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>

      <!-- Tier 1 -->
      <path d="M -36 -30 C -36 -15, 36 -15, 36 -30 V -10 C 36 5, -36 5, -36 -10 Z" fill="#0f172a" stroke="#00f2fe" stroke-width="2" filter="url(#hologram-glow)"/>
      <ellipse cx="0" cy="-30" rx="36" ry="12" fill="#0284c7" fill-opacity="0.5" stroke="#00f2fe" stroke-width="2"/>
      <ellipse cx="0" cy="-30" rx="16" ry="5" fill="#ffffff" filter="url(#hologram-glow)"/>

      <!-- Center Bolt Icon -->
      <path d="M 4 -18 L -6 4 L 2 4 L -4 22 L 10 -4 L 2 -4 Z" fill="#fbbf24" filter="url(#hologram-glow)"/>
    </g>

    <!-- ======================================================== -->
    <!-- BOTTOM TELEMETRY GAUGES & METRICS HUD                    -->
    <!-- ======================================================== -->
    <g transform="translate(28, 335)">
      <!-- HUD Line Divider -->
      <line x1="0" y1="0" x2="454" y2="0" stroke="#1e293b" stroke-width="1.5"/>

      <text x="0" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">SYSTEM TELEMETRY &amp; REAL-TIME GUARDS</text>

      <!-- Gauge 1: O(1) B-Tree Probe -->
      <g transform="translate(0, 36)">
        <rect width="142" height="68" rx="10" fill="#0a1322" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="12" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#7dd3fc">O(1) DISCOVERY</text>
        <text x="12" y="52" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="900" fill="#00f2fe" filter="url(#hologram-glow)">0.38ms</text>
      </g>

      <!-- Gauge 2: Watchdog Guard -->
      <g transform="translate(156, 36)">
        <rect width="142" height="68" rx="10" fill="#0a1322" stroke="#f59e0b" stroke-width="1.5"/>
        <text x="12" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#fcd34d">CTE WATCHDOG</text>
        <text x="12" y="52" font-family="'JetBrains Mono', monospace" font-size="19" font-weight="900" fill="#fbbf24">1M SAFE</text>
      </g>

      <!-- Gauge 3: Tokenomics -->
      <g transform="translate(312, 36)">
        <rect width="142" height="68" rx="10" fill="#0a1322" stroke="#a855f7" stroke-width="1.5"/>
        <text x="12" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#d8b4fe">TOKEN CEILING</text>
        <text x="12" y="52" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="900" fill="#c084fc">-54.9%</text>
      </g>
    </g>

    <!-- Bottom Execution Command CTA -->
    <g transform="translate(28, 465)">
      <rect width="454" height="32" rx="8" fill="#060c18" stroke="#334155" stroke-width="1"/>
      <text x="14" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8">$ <tspan fill="#f8fafc">uvx fastmcp-sqlite --db app.db</tspan></text>
      <text x="365" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34d399">READY</text>
      <circle cx="430" cy="16" r="4" fill="#34d399" filter="url(#hologram-glow)"/>
    </g>
  </g>
</svg>
