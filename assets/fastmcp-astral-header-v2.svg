<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" style="background:#07080C;font-family:'Geist Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Master Background Grid 32pt with Dot Intersections -->
    <pattern id="astralGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#121624" stroke-width="1" stroke-opacity="0.7"/>
      <circle cx="32" cy="32" r="1" fill="#1E283D" opacity="0.9"/>
    </pattern>

    <!-- Master Astral Gradients with LinearRGB Smooth Interpolation -->
    <linearGradient id="brandEmeraldCyan" x1="0%" y1="0%" x2="100%" y2="100%" color-interpolation="linearRGB">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="45%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="textShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="sqliteAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="60%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <!-- Dual Astral Ambient Auras -->
    <radialGradient id="leftEmeraldAura" cx="24%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.14"/>
      <stop offset="40%" stop-color="#06B6D4" stop-opacity="0.06"/>
      <stop offset="85%" stop-color="#07080C" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="rightCobaltAura" cx="82%" cy="24%" r="45%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#07080C" stop-opacity="0"/>
    </radialGradient>

    <!-- Precision High-Density Glow Filter -->
    <filter id="astralGlow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Soft Depth Shadow -->
    <filter id="astralShadow" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Canvas Base & Atmospheres -->
  <rect width="1280" height="640" fill="#07080C"/>
  <rect width="1280" height="640" fill="url(#leftEmeraldAura)"/>
  <rect width="1280" height="640" fill="url(#rightCobaltAura)"/>
  <rect width="1280" height="640" fill="url(#astralGrid)"/>

  <!-- Top Swiss Telemetry Header Rule -->
  <g transform="translate(48, 36)">
    <line x1="0" y1="0" x2="1184" y2="0" stroke="#182030" stroke-width="1"/>
    <circle cx="0" cy="0" r="2.5" fill="#10B981"/>
    <circle cx="1184" cy="0" r="2.5" fill="#38BDF8"/>
    <text x="12" y="-10" fill="#64748B" font-family="'Geist Mono',monospace" font-size="10" font-weight="600" letter-spacing="1.5">
      FASTMCP-SQLITE // HIGH-PERFORMANCE MCP ARCHITECTURE
    </text>
    <text x="1172" y="-10" text-anchor="end" fill="#64748B" font-family="'Geist Mono',monospace" font-size="10" font-weight="600" letter-spacing="1.5">
      STDIO JSON-RPC 2.0 · PYTHON 3.10-3.14
    </text>
  </g>

  <!-- LEFT HERO BRANDMARK LOCKUP (TRIPLE ISOMETRIC DATABASE PLATTERS + KINETIC LIGHTNING) -->
  <g transform="translate(120, 148)" filter="url(#astralShadow)">
    <!-- Ambient Aura -->
    <circle cx="150" cy="150" r="140" fill="#10B981" opacity="0.06" filter="url(#astralGlow)"/>

    <!-- Database Disc Base Tier 3 -->
    <path d="M 40 210 C 40 245, 260 245, 260 210 L 260 245 C 260 280, 40 280, 40 245 Z" fill="#0C1322" stroke="#223048" stroke-width="2"/>
    <path d="M 40 210 C 40 245, 260 245, 260 210" fill="none" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Database Disc Mid Tier 2 -->
    <path d="M 40 140 C 40 175, 260 175, 260 140 L 260 175 C 260 210, 40 210, 40 175 Z" fill="#101B30" stroke="#0284C7" stroke-width="2" stroke-opacity="0.8"/>
    <ellipse cx="150" cy="140" rx="110" ry="32" fill="#16233B" stroke="#334768" stroke-width="2"/>

    <!-- Database Disc Top Master Tier 1 -->
    <path d="M 40 70 C 40 105, 260 105, 260 70 L 260 105 C 260 140, 40 140, 40 105 Z" fill="#172744" stroke="#10B981" stroke-width="2.5"/>
    <ellipse cx="150" cy="70" rx="110" ry="32" fill="#0B1220" stroke="#10B981" stroke-width="3" filter="url(#astralGlow)"/>
    
    <!-- Concentric High-Speed Data Track Rings -->
    <ellipse cx="150" cy="70" rx="88" ry="24" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="8 5"/>
    <ellipse cx="150" cy="70" rx="58" ry="15" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>

    <!-- Dynamic Kinetic 45° Lightning Bolt Slash (FastMCP Velocity Metaphor) -->
    <polygon points="190,15 125,150 170,150 100,300 225,130 170,130" fill="url(#brandEmeraldCyan)" filter="url(#astralGlow)"/>
    <polygon points="182,32 135,142 168,142 118,275 208,136 166,136" fill="#FFFFFF" opacity="0.94"/>

    <!-- Kinetic Velocity Spark Nodes -->
    <circle cx="190" cy="15" r="3.5" fill="#FFFFFF" filter="url(#astralGlow)"/>
    <circle cx="100" cy="300" r="4" fill="#00F0FF" filter="url(#astralGlow)"/>
    <circle cx="170" cy="150" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- RIGHT BRAND TYPOGRAPHY & ARCHITECTURE LOCKUP -->
  <g transform="translate(480, 160)">
    <!-- 1. Protocol Badge Pill (Raycast Glass Style) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="224" height="30" rx="15" fill="#0E1626" stroke="#1E2E48" stroke-width="1.5"/>
      <circle cx="16" cy="15" r="4.5" fill="#10B981" filter="url(#astralGlow)"/>
      <text x="30" y="19.5" fill="#38BDF8" font-family="'Geist Mono',monospace" font-size="11.5" font-weight="700" letter-spacing="1.8">
        MCP PROTOCOL 1.0
      </text>
    </g>

    <!-- 2. Main Wordmark Display (Geist Sans Ultra Bold) -->
    <g transform="translate(0, 80)">
      <text x="0" y="0" font-size="68" font-weight="900" letter-spacing="-2.2" fill="#FFFFFF">
        fastmcp<tspan fill="url(#sqliteAccent)">-sqlite</tspan>
      </text>
    </g>

    <!-- 3. Subtitle / Architecture Tagline -->
    <g transform="translate(0, 122)">
      <text x="0" y="0" font-size="20" font-weight="500" fill="#94A3B8" letter-spacing="0.2">
        High-Performance, Zero-Config SQLite Server for LLMs &amp; AI Agents
      </text>
    </g>

    <!-- 4. Architectural Capability Feature Badges (3-Column Layout) -->
    <g transform="translate(0, 165)">
      <!-- Badge 1: O(1) Schema Probe -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="186" height="48" rx="8" fill="#0D1424" stroke="#1E2A40" stroke-width="1.2"/>
        <path d="M 16 24 L 21 29 L 32 18" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="42" y="22" fill="#F1F5F9" font-size="13" font-weight="700" letter-spacing="0.3">O(1) Schema Probe</text>
        <text x="42" y="38" fill="#64748B" font-family="'Geist Mono',monospace" font-size="10.5" font-weight="600">&lt;1ms P99 Latency</text>
      </g>

      <!-- Badge 2: Watchdog Guard -->
      <g transform="translate(202, 0)">
        <rect x="0" y="0" width="194" height="48" rx="8" fill="#0D1424" stroke="#1E2A40" stroke-width="1.2"/>
        <circle cx="24" cy="24" r="7" fill="none" stroke="#38BDF8" stroke-width="2"/>
        <path d="M 24 20 L 24 24 L 27 27" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/>
        <text x="42" y="22" fill="#F1F5F9" font-size="13" font-weight="700" letter-spacing="0.3">Watchdog Protection</text>
        <text x="42" y="38" fill="#64748B" font-family="'Geist Mono',monospace" font-size="10.5" font-weight="600">&lt;5ms Runaway Abort</text>
      </g>

      <!-- Badge 3: Strict Tokenomics -->
      <g transform="translate(412, 0)">
        <rect x="0" y="0" width="186" height="48" rx="8" fill="#0D1424" stroke="#1E2A40" stroke-width="1.2"/>
        <rect x="16" y="17" width="14" height="14" rx="3" fill="none" stroke="#A855F7" stroke-width="2"/>
        <path d="M 20 24 L 26 24" stroke="#A855F7" stroke-width="1.5"/>
        <text x="40" y="22" fill="#F1F5F9" font-size="13" font-weight="700" letter-spacing="0.3">24KB Token Ceiling</text>
        <text x="40" y="38" fill="#64748B" font-family="'Geist Mono',monospace" font-size="10.5" font-weight="600">Strict UTF-8 Guard</text>
      </g>
    </g>
  </g>

  <!-- BOTTOM SWISS TELEMETRY & STATUS DOCK -->
  <g transform="translate(48, 576)">
    <line x1="0" y1="0" x2="1184" y2="0" stroke="#182030" stroke-width="1"/>
    
    <!-- Dock Status Items -->
    <g font-family="'Geist Mono',monospace" font-size="11" font-weight="500" letter-spacing="0.5">
      <text x="0" y="24" fill="#64748B">
        <tspan fill="#38BDF8" font-weight="700">ENGINE:</tspan> Standard Library sqlite3 (Zero C++ Build)
      </text>
      <text x="490" y="24" fill="#64748B">
        <tspan fill="#06B6D4" font-weight="700">CONCURRENCY:</tspan> PRAGMA journal_mode=WAL (Multi-Reader)
      </text>
      <text x="1000" y="24" fill="#10B981" font-weight="700" letter-spacing="1">
        ● READY v1.0.0 (SUB-20MS)
      </text>
    </g>
  </g>
</svg>