<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" style="background-color: #0b0d0e; font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif;">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="swiss-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
    <!-- Subtle Radial Glow for Depth without Slop -->
    <radialGradient id="subtle-focus" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0b0d0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Linear Accent Gradient -->
    <linearGradient id="cobalt-fade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Canvas Surface -->
  <rect width="800" height="800" fill="#0b0d0e"/>
  <rect width="800" height="800" fill="url(#subtle-focus)"/>
  <rect width="800" height="800" fill="url(#swiss-grid)"/>

  <!-- Golden Ratio & Swiss Grid Construction Lines (Engineering Layer) -->
  <g id="construction-lines" opacity="0.35">
    <!-- Center Axis -->
    <line x1="400" y1="40" x2="400" y2="760" stroke="#334155" stroke-width="0.75" stroke-dasharray="4 4"/>
    <line x1="40" y1="400" x2="760" y2="400" stroke="#334155" stroke-width="0.75" stroke-dasharray="4 4"/>
    
    <!-- Golden Ratio Boundary (phi = 1.618) -->
    <rect x="200" y="200" width="400" height="400" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.4"/>
    <circle cx="400" cy="400" r="200" fill="none" stroke="#475569" stroke-width="0.75" stroke-dasharray="2 4"/>
    <circle cx="400" cy="400" r="123.6" fill="none" stroke="#475569" stroke-width="0.75" stroke-dasharray="2 4"/>
    
    <!-- 45-degree Swiss Diagonal Guides -->
    <line x1="200" y1="200" x2="600" y2="600" stroke="#334155" stroke-width="0.5"/>
    <line x1="200" y1="600" x2="600" y2="200" stroke="#334155" stroke-width="0.5"/>
  </g>

  <!-- Outer Frame & Registration Marks -->
  <g id="registration-marks" stroke="#64748b" stroke-width="1">
    <!-- Top-Left Mark -->
    <line x1="60" y1="60" x2="90" y2="60"/>
    <line x1="60" y1="60" x2="60" y2="90"/>
    <!-- Top-Right Mark -->
    <line x1="740" y1="60" x2="710" y2="60"/>
    <line x1="740" y1="60" x2="740" y2="90"/>
    <!-- Bottom-Left Mark -->
    <line x1="60" y1="740" x2="90" y2="740"/>
    <line x1="60" y1="740" x2="60" y2="710"/>
    <!-- Bottom-Right Mark -->
    <line x1="740" y1="740" x2="710" y2="740"/>
    <line x1="740" y1="740" x2="740" y2="710"/>
  </g>

  <!-- Editorial Metadata (Swiss International Typographic Header) -->
  <g id="editorial-header" fill="#94a3b8">
    <text x="60" y="95" font-size="10" font-family="'JetBrains Mono', 'Berkeley Mono', monospace" letter-spacing="1.5" text-transform="uppercase">SPEC // SWISS PRECISION MONOGRAM</text>
    <text x="60" y="110" font-size="9" font-family="'JetBrains Mono', monospace" fill="#475569" letter-spacing="1">GEOMETRIC CODEC: MODULAR F-S-LIGHTNING LOCKUP</text>
    <text x="740" y="95" font-size="10" font-family="'JetBrains Mono', monospace" letter-spacing="1.5" text-anchor="end">O(1) DISCOVERY ENGINE</text>
    <text x="740" y="110" font-size="9" font-family="'JetBrains Mono', monospace" fill="#38bdf8" letter-spacing="1" text-anchor="end">SYS_VER // 2.0.0</text>
  </g>

  <!-- CORE BRANDMARK: The Swiss Precision Monogram -->
  <!-- A masterfully composed 2D flat geometric glyph uniting F, S, and Lightning -->
  <g id="monogram-symbol" transform="translate(0, 0)">
    <!-- Main Positive Glyph Body (Constructed with Pure Math) -->
    <!-- Top Horizontal Bar (F Upper Bar) -->
    <path d="M 240 240 L 560 240 L 560 300 L 300 300 L 300 380 L 480 380 L 480 440 L 300 440 L 300 560 L 240 560 Z" 
          fill="#f1f5f9" 
          fill-rule="evenodd"/>

    <!-- Dynamic S-Curve Intersecting Segment (Right Lower Anchor) -->
    <path d="M 500 380 L 560 380 L 560 560 L 320 560 L 320 500 L 500 500 Z" 
          fill="#f1f5f9"/>

    <!-- Negative Space Lightning Bolt (O(1) Speed Metaphor Cutting Through Center) -->
    <polygon points="410,210 330,370 410,370 370,550 470,350 390,350" 
             fill="#0b0d0e" 
             stroke="#38bdf8" 
             stroke-width="3"
             stroke-linejoin="miter"/>

    <!-- Fine Hairline Accent Core -->
    <polygon points="410,210 330,370 410,370 370,550 470,350 390,350" 
             fill="url(#cobalt-fade)" 
             opacity="0.9"/>
             
    <!-- Sub-pixel Precision Anchors (Micro Dots on Grid Vertices) -->
    <circle cx="240" cy="240" r="3" fill="#38bdf8"/>
    <circle cx="560" cy="240" r="3" fill="#38bdf8"/>
    <circle cx="560" cy="560" r="3" fill="#38bdf8"/>
    <circle cx="240" cy="560" r="3" fill="#38bdf8"/>
    <circle cx="400" cy="400" r="2.5" fill="#f1f5f9"/>
  </g>

  <!-- Editorial Technical Footer -->
  <g id="editorial-footer" fill="#64748b">
    <line x1="60" y1="680" x2="740" y2="680" stroke="#1e293b" stroke-width="1"/>
    
    <text x="60" y="708" font-size="11" font-weight="600" fill="#f1f5f9" font-family="'Inter', sans-serif" letter-spacing="-0.2">fastmcp-sqlite</text>
    <text x="160" y="708" font-size="10" font-family="'JetBrains Mono', monospace" fill="#475569">|</text>
    <text x="175" y="708" font-size="10" font-family="'JetBrains Mono', monospace" fill="#94a3b8">ARCH: ZERO_DEPENDENCY_SQLITE3</text>
    
    <text x="740" y="708" font-size="10" font-family="'JetBrains Mono', monospace" fill="#38bdf8" text-anchor="end">FIG 1.0 — PRECISION MONOGRAM</text>
    <text x="740" y="724" font-size="8.5" font-family="'JetBrains Mono', monospace" fill="#475569" text-anchor="end">GRID: 40PX // PHI: 1.618 // SHADOW_DISCARD: TRUE</text>
  </g>
</svg>
