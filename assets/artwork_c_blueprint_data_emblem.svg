<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" style="background-color: #060a12; font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif;">
  <defs>
    <!-- Blueprint Coordinate Dot Grid -->
    <pattern id="blueprint-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.6" fill="#1e3a8a" opacity="0.6"/>
    </pattern>
    <!-- Blueprint Secondary Grid Lines -->
    <pattern id="blueprint-grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#172554" stroke-width="0.5" stroke-opacity="0.8"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="800" height="800" fill="#060a12"/>
  <rect width="800" height="800" fill="url(#blueprint-dots)"/>
  <rect width="800" height="800" fill="url(#blueprint-grid)"/>

  <!-- Blueprint Engineering Border with Title Block -->
  <rect x="30" y="30" width="740" height="740" fill="none" stroke="#1d4ed8" stroke-width="1.2" stroke-opacity="0.6"/>
  <rect x="34" y="34" width="732" height="732" fill="none" stroke="#1e293b" stroke-width="0.75"/>

  <!-- Corner Precision Crosshairs -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.7">
    <!-- Top-Left Crosshair -->
    <path d="M 45 50 L 55 50 M 50 45 L 50 55"/>
    <!-- Top-Right Crosshair -->
    <path d="M 745 50 L 755 50 M 750 45 L 750 55"/>
    <!-- Bottom-Left Crosshair -->
    <path d="M 45 750 L 55 750 M 50 745 L 50 755"/>
    <!-- Bottom-Right Crosshair -->
    <path d="M 745 750 L 755 750 M 750 745 L 750 755"/>
  </g>

  <!-- Technical Header Block -->
  <g font-family="'JetBrains Mono', 'Berkeley Mono', monospace" fill="#93c5fd" font-size="9.5" letter-spacing="1.2">
    <text x="60" y="65">ARCHITECTURAL SCHEMATIC // MCP-SQLITE ENGINE</text>
    <text x="60" y="80" font-size="8" fill="#64748b">DRAWING NO: FASTMCP-SQL-2026-REV3</text>
    <text x="740" y="65" text-anchor="end" fill="#38bdf8">SCALE: 1:1 VECTOR BLUEPRINT</text>
    <text x="740" y="80" text-anchor="end" font-size="8" fill="#64748b">MODULE: B+TREE / O(1) DISCOVERY</text>
    <line x1="50" y1="95" x2="750" y2="95" stroke="#1e3a8a" stroke-width="0.75"/>
  </g>

  <!-- CENTRAL EMBLEM: Architectural B+Tree / SQLite Sector Schematic -->
  <g id="schematic-core" transform="translate(400, 390)">
    <!-- Concentric Technical Pitch Circles (B+Tree Traversal Coordinates) -->
    <circle cx="0" cy="0" r="220" fill="none" stroke="#1e3a8a" stroke-width="0.75" stroke-dasharray="3 3"/>
    <circle cx="0" cy="0" r="170" fill="none" stroke="#1d4ed8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="6 2"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#60a5fa" stroke-width="1.2"/>

    <!-- Coordinate Axis & Radial Rulers -->
    <line x1="-240" y1="0" x2="240" y2="0" stroke="#1e293b" stroke-width="1"/>
    <line x1="0" y1="-240" x2="0" y2="240" stroke="#1e293b" stroke-width="1"/>
    <line x1="-160" y1="-160" x2="160" y2="160" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="2 4"/>
    <line x1="-160" y1="160" x2="160" y2="-160" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="2 4"/>

    <!-- B+Tree Hierarchy Layer (Root Node -> Interior Nodes -> Leaf Pages) -->
    <!-- Root Node (Top) -->
    <rect x="-45" y="-140" width="90" height="32" rx="4" fill="#0b1329" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="0" y="-120" font-family="'JetBrains Mono', monospace" font-size="9" fill="#e2e8f0" font-weight="600" text-anchor="middle">ROOT [PAGE 1]</text>
    
    <!-- Connector Branches -->
    <path d="M 0 -108 L -100 -40 M 0 -108 L 100 -40 M 0 -108 L 0 -40" stroke="#60a5fa" stroke-width="1.2" fill="none"/>

    <!-- Interior Nodes (Mid Tier) -->
    <rect x="-145" y="-40" width="90" height="28" rx="3" fill="#0b1329" stroke="#93c5fd" stroke-width="1.2"/>
    <text x="-100" y="-22" font-family="'JetBrains Mono', monospace" font-size="8" fill="#93c5fd" text-anchor="middle">PTR_L // 0x0A</text>

    <rect x="-45" y="-40" width="90" height="28" rx="3" fill="#0b1329" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="0" y="-22" font-family="'JetBrains Mono', monospace" font-size="8" fill="#38bdf8" text-anchor="middle">STAT1 // O(1)</text>

    <rect x="55" y="-40" width="90" height="28" rx="3" fill="#0b1329" stroke="#93c5fd" stroke-width="1.2"/>
    <text x="100" y="-22" font-family="'JetBrains Mono', monospace" font-size="8" fill="#93c5fd" text-anchor="middle">PTR_R // 0xFF</text>

    <!-- Connector to Leaf Pages (Lower Tier) -->
    <path d="M -100 -12 L -130 50 M -100 -12 L -70 50" stroke="#3b82f6" stroke-width="1" fill="none"/>
    <path d="M 0 -12 L -20 50 M 0 -12 L 20 50" stroke="#38bdf8" stroke-width="1.2" fill="none"/>
    <path d="M 100 -12 L 70 50 M 100 -12 L 130 50" stroke="#3b82f6" stroke-width="1" fill="none"/>

    <!-- Leaf Pages Array (4096-Byte Blocks) -->
    <g transform="translate(0, 50)">
      <rect x="-160" y="0" width="48" height="36" rx="2" fill="#111c3a" stroke="#60a5fa" stroke-width="1"/>
      <text x="-136" y="22" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#94a3b8" text-anchor="middle">4KB</text>

      <rect x="-100" y="0" width="48" height="36" rx="2" fill="#111c3a" stroke="#60a5fa" stroke-width="1"/>
      <text x="-76" y="22" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#94a3b8" text-anchor="middle">4KB</text>

      <!-- Primary Fast Target Node (Highlighted Leaf) -->
      <rect x="-40" y="0" width="80" height="36" rx="3" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="0" y="16" font-family="'JetBrains Mono', monospace" font-size="8" fill="#ffffff" font-weight="700" text-anchor="middle">MAX(ROWID)</text>
      <text x="0" y="28" font-family="'JetBrains Mono', monospace" font-size="7" fill="#bae6fd" text-anchor="middle">O(1) LEAF</text>

      <rect x="52" y="0" width="48" height="36" rx="2" fill="#111c3a" stroke="#60a5fa" stroke-width="1"/>
      <text x="76" y="22" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#94a3b8" text-anchor="middle">4KB</text>

      <rect x="112" y="0" width="48" height="36" rx="2" fill="#111c3a" stroke="#60a5fa" stroke-width="1"/>
      <text x="136" y="22" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#94a3b8" text-anchor="middle">4KB</text>
      
      <!-- Leaf Level Sequential Scan Link (Double Arrow) -->
      <line x1="-165" y1="42" x2="165" y2="42" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2"/>
    </g>

    <!-- Technical Drafting Callouts & Dimension Annotations -->
    <!-- Dimension Marker Left -->
    <g transform="translate(-180, -90)" font-family="'JetBrains Mono', monospace" font-size="8" fill="#38bdf8">
      <line x1="0" y1="0" x2="-35" y2="-20" stroke="#38bdf8" stroke-width="0.75"/>
      <circle cx="0" cy="0" r="2" fill="#38bdf8"/>
      <text x="-40" y="-22" text-anchor="end">R_PAGE = 4096B</text>
    </g>

    <!-- Dimension Marker Right -->
    <g transform="translate(145, -25)" font-family="'JetBrains Mono', monospace" font-size="8" fill="#38bdf8">
      <line x1="0" y1="0" x2="35" y2="-15" stroke="#38bdf8" stroke-width="0.75"/>
      <circle cx="0" cy="0" r="2" fill="#38bdf8"/>
      <text x="40" y="-12">OPCODE_CAP: 1,000,000</text>
    </g>

    <!-- Dimension Marker Bottom -->
    <g transform="translate(0, 100)" font-family="'JetBrains Mono', monospace" font-size="8" fill="#00f0ff">
      <line x1="0" y1="0" x2="0" y2="25" stroke="#00f0ff" stroke-width="0.75"/>
      <circle cx="0" cy="0" r="2" fill="#00f0ff"/>
      <text x="0" y="38" text-anchor="middle">WAL_MMAP: 256MB // CACHE: 64MB</text>
    </g>
  </g>

  <!-- Editorial Engineering Title Block (Bottom Right Standard) -->
  <g id="title-block" transform="translate(480, 640)">
    <rect x="0" y="0" width="260" height="90" fill="#0b1329" stroke="#1d4ed8" stroke-width="1"/>
    <line x1="0" y1="30" x2="260" y2="30" stroke="#1e3a8a" stroke-width="0.75"/>
    <line x1="0" y1="60" x2="260" y2="60" stroke="#1e3a8a" stroke-width="0.75"/>
    <line x1="130" y1="30" x2="130" y2="90" stroke="#1e3a8a" stroke-width="0.75"/>

    <text x="10" y="20" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#f8fafc">FASTMCP-SQLITE ENGINE</text>
    
    <text x="10" y="48" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">APPROVED BY:</text>
    <text x="10" y="56" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#93c5fd">CHIEF ARCHITECT</text>

    <text x="140" y="48" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">DATE / VER:</text>
    <text x="140" y="56" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#38bdf8">2026-08-30 // v2.0</text>

    <text x="10" y="78" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">SHEET NO:</text>
    <text x="10" y="86" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#e2e8f0">03 OF 03</text>

    <text x="140" y="78" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">DISCOVERY:</text>
    <text x="140" y="86" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#10b981">O(1) CONSTANT</text>
  </g>

  <!-- Left Bottom Legend -->
  <g transform="translate(60, 660)" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">
    <text x="0" y="0">SPECIFICATIONS & TOLERANCES:</text>
    <text x="0" y="14" fill="#94a3b8">1. ZERO EXTERNAL DRIVER DEPENDENCIES (PURE STDLIB SQLITE3)</text>
    <text x="0" y="28" fill="#94a3b8">2. STRICT UTF-8 BYTE-CAP ENFORCEMENT AT 24,576 BYTES</text>
    <text x="0" y="42" fill="#94a3b8">3. RUNAWAY WATCHDOG PROGRESS INTERRUPT AT 1,000,000 OPCODES</text>
    <text x="0" y="56" fill="#38bdf8">4. PROMPT CACHING LATENCY FOOTER PRESERVATION (>97% STABILITY)</text>
  </g>
</svg>
