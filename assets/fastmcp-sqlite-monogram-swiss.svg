<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" style="background:#050508;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,'Geist Mono',Arial,sans-serif;">
  <defs>
    <!-- Master Gradients -->
    <linearGradient id="swissAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <!-- Subtle Background Grid Pattern -->
    <pattern id="swissGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#12131C" stroke-width="1"/>
    </pattern>

    <!-- Hard Edge Drop Shadow -->
    <filter id="crispShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <radialGradient id="centralAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.1"/>
      <stop offset="80%" stop-color="#050508" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#050508"/>
  <rect width="512" height="512" fill="url(#centralAura)"/>
  <rect width="512" height="512" fill="url(#swissGrid)"/>

  <!-- Squircle Container Base (App Icon Tile) -->
  <g transform="translate(64, 64)" filter="url(#crispShadow)">
    <!-- Squircle Card -->
    <rect x="0" y="0" width="384" height="384" rx="84" fill="#0C0D14" stroke="#1E2235" stroke-width="2"/>
    <rect x="2" y="2" width="380" height="380" rx="82" fill="none" stroke="#2B324D" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Subtle Diagonal Engineering Accent Slice -->
    <line x1="24" y1="360" x2="360" y2="24" stroke="#1A2035" stroke-width="1.5" stroke-dasharray="4 8"/>

    <!-- SWISS MONOGRAM ICON CORE -->
    <g transform="translate(64, 64)">
      <!-- Base Negative Space Database Ring Tier 2 -->
      <path d="M 32 176 C 32 208, 224 208, 224 176 L 224 208 C 224 240, 32 240, 32 208 Z" fill="#151A29"/>
      <ellipse cx="128" cy="176" rx="96" ry="24" fill="#0F1320" stroke="#1E263E" stroke-width="2"/>

      <!-- Lettermark "F" Bar 1 (Top Horizontal Rail) -->
      <rect x="32" y="32" width="192" height="28" rx="6" fill="#FFFFFF"/>

      <!-- Lettermark "F" Bar 2 (Mid Horizontal Rail) -->
      <rect x="32" y="96" width="128" height="28" rx="6" fill="#FFFFFF"/>

      <!-- Lettermark Vertical Stem (Connecting F and SQLite Pillar) -->
      <rect x="32" y="32" width="32" height="192" rx="6" fill="#FFFFFF"/>

      <!-- SQLite "Feather / Kinetic Chevron" Accent (45° Precision Blade) -->
      <polygon points="176,76 224,76 148,224 100,224" fill="url(#swissAccent)"/>
      <circle cx="162" cy="150" r="6" fill="#FFFFFF"/>

      <!-- Micro Scale Ratio Ticks (Swiss Measurement Marks) -->
      <line x1="236" y1="32" x2="236" y2="44" stroke="#475569" stroke-width="2"/>
      <line x1="236" y1="96" x2="236" y2="108" stroke="#475569" stroke-width="2"/>
      <line x1="236" y1="160" x2="236" y2="172" stroke="#475569" stroke-width="2"/>
      <line x1="236" y1="224" x2="236" y2="236" stroke="#475569" stroke-width="2"/>
    </g>

    <!-- Sub-label in Pure Swiss Neo-Grotesque Tracking -->
    <text x="192" y="344" text-anchor="middle" fill="#64748B" font-size="11" font-weight="700" letter-spacing="4">
      FASTMCP · SQLITE
    </text>
  </g>

  <!-- Outer Swiss Coordinate Marks -->
  <g fill="#334155" font-size="9" font-weight="600" letter-spacing="1">
    <text x="24" y="36">SYS.02</text>
    <text x="440" y="36">512×512</text>
    <text x="24" y="490">GRID: 8PT</text>
    <text x="430" y="490">OKLCH: P3</text>
  </g>
</svg>
