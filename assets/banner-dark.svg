<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-dark)"/>
  <rect width="1200" height="360" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Subtle Grid lines -->
  <g stroke="#1e293b" stroke-width="1" stroke-opacity="0.4">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
  </g>

  <!-- Glowing background orb -->
  <circle cx="200" cy="180" r="120" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1000" cy="180" r="140" fill="#c084fc" opacity="0.08" filter="url(#glow)"/>

  <!-- Logo / Database Icon -->
  <g transform="translate(100, 110)">
    <rect x="0" y="0" width="140" height="140" rx="28" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <!-- Cylinder Top -->
    <ellipse cx="70" cy="45" rx="42" ry="14" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="3"/>
    <!-- Cylinder Middle Segment -->
    <path d="M 28 45 V 75 C 28 83, 112 83, 112 75 V 45" fill="none" stroke="#818cf8" stroke-width="3"/>
    <!-- Cylinder Bottom Segment -->
    <path d="M 28 75 V 102 C 28 110, 112 110, 112 102 V 75" fill="none" stroke="#c084fc" stroke-width="3"/>
    <!-- Bolt / Speed symbol -->
    <path d="M 72 48 L 56 78 L 70 78 L 66 98 L 84 68 L 70 68 Z" fill="#facc15" filter="url(#glow)"/>
  </g>

  <!-- Main Title & Subtitles -->
  <g transform="translate(280, 125)">
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="url(#primary-grad)" letter-spacing="-1">fastmcp-sqlite</text>
    <text x="0" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">The High-Performance, Token-Efficient SQLite MCP Server for AI Agents</text>
  </g>

  <!-- Feature Badges on Banner -->
  <g transform="translate(280, 230)">
    <!-- Badge 1: Zero Native Deps -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="8" fill="url(#badge-grad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5"/>
      <circle cx="22" cy="21" r="5" fill="#38bdf8"/>
      <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Zero Native Addons</text>
    </g>

    <!-- Badge 2: O(1) Schema -->
    <g transform="translate(195, 0)">
      <rect width="175" height="42" rx="8" fill="url(#badge-grad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.5"/>
      <circle cx="22" cy="21" r="5" fill="#818cf8"/>
      <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">O(1) Discovery (0.8ms)</text>
    </g>

    <!-- Badge 3: 3.6ms Watchdog -->
    <g transform="translate(385, 0)">
      <rect width="180" height="42" rx="8" fill="url(#badge-grad)" stroke="#f43f5e" stroke-width="1.2" stroke-opacity="0.5"/>
      <circle cx="22" cy="21" r="5" fill="#f43f5e"/>
      <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">3.6ms CTE Watchdog</text>
    </g>

    <!-- Badge 4: Token Savings -->
    <g transform="translate(580, 0)">
      <rect width="175" height="42" rx="8" fill="url(#badge-grad)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.5"/>
      <circle cx="22" cy="21" r="5" fill="#10b981"/>
      <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">54.9% Token Savings</text>
    </g>
  </g>
</svg>
