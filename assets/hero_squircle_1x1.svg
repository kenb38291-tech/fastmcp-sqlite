<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradients -->
    <radialGradient id="bg-glow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0e1e38"/>
      <stop offset="60%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#070a12"/>
    </radialGradient>

    <!-- Neon Accents -->
    <linearGradient id="cyan-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="squircle-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="cylinder-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#334155" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="core-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feGaussianBlur stdDeviation="24" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="ambient-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
    </filter>
  </defs>

  <!-- Canvas Background (#070a12 for seamless GitHub #0d1117 embedding) -->
  <rect width="512" height="512" fill="#070a12" rx="32"/>

  <!-- Ambient Light Orbs -->
  <circle cx="256" cy="256" r="160" fill="#0284c7" opacity="0.16" filter="url(#ambient-soft)"/>
  <circle cx="256" cy="210" r="90" fill="#6366f1" opacity="0.14" filter="url(#ambient-soft)"/>

  <!-- Superellipse (Squircle) Outer Shell -->
  <g transform="translate(36, 36)">
    <!-- Shadow Base -->
    <rect x="0" y="8" width="440" height="440" rx="96" fill="#000000" opacity="0.6" filter="url(#ambient-soft)"/>
    
    <!-- Squircle Card Surface -->
    <rect x="0" y="0" width="440" height="440" rx="96" fill="url(#bg-glow)"/>
    <rect x="0" y="0" width="440" height="440" rx="96" fill="none" stroke="url(#squircle-border)" stroke-width="2.5"/>

    <!-- Subtle Optical Inner Border -->
    <rect x="5" y="5" width="430" height="430" rx="91" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

    <!-- Cyber Grid Alignment Lines -->
    <g stroke="#38bdf8" stroke-opacity="0.07" stroke-width="1">
      <line x1="220" y1="35" x2="220" y2="405" stroke-dasharray="4 6"/>
      <line x1="35" y1="220" x2="405" y2="220" stroke-dasharray="4 6"/>
      <circle cx="220" cy="220" r="160" fill="none" stroke-dasharray="3 8"/>
    </g>

    <!-- MCP Quantum Neural Orbits -->
    <g transform="translate(220, 210)">
      <!-- Outer Elliptical Orbit Ring -->
      <ellipse cx="0" cy="0" rx="150" ry="58" fill="none" stroke="url(#cyan-blue-grad)" stroke-width="1.8" stroke-dasharray="140 10 40 10" transform="rotate(-28)" opacity="0.8" filter="url(#core-glow)"/>
      <circle cx="-135" cy="55" r="4.5" fill="#00f2fe" filter="url(#core-glow)"/>
      <circle cx="130" cy="-55" r="5" fill="#818cf8" filter="url(#core-glow)"/>

      <!-- Counter Orbit Ring -->
      <ellipse cx="0" cy="0" rx="150" ry="58" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="80 15 120 15" transform="rotate(38)" opacity="0.7"/>
      <circle cx="120" cy="80" r="4" fill="#34d399" filter="url(#core-glow)"/>
      <circle cx="-110" cy="-75" r="4" fill="#34d399"/>
    </g>

    <!-- Central 3D SQLite Multi-Tier Database Core -->
    <g transform="translate(145, 115)">
      <!-- Tier 3: Bottom Base Segment -->
      <path d="M 0 130 C 0 152, 150 152, 150 130 V 160 C 150 182, 0 182, 0 160 Z" fill="url(#cylinder-body)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8"/>
      <ellipse cx="75" cy="130" rx="75" ry="24" fill="#1e293b" fill-opacity="0.5" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>

      <!-- Tier 2: Middle Segment -->
      <path d="M 0 75 C 0 97, 150 97, 150 75 V 110 C 150 132, 0 132, 0 110 Z" fill="url(#cylinder-body)" stroke="#818cf8" stroke-width="2" stroke-opacity="0.85"/>
      <ellipse cx="75" cy="75" rx="75" ry="24" fill="#1e293b" fill-opacity="0.6" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.5"/>

      <!-- Tier 1: Top Cap Cylinder Segment with Glowing Core -->
      <path d="M 0 20 C 0 42, 150 42, 150 20 V 55 C 150 77, 0 77, 0 55 Z" fill="url(#cylinder-body)" stroke="#00f2fe" stroke-width="2.2" filter="url(#core-glow)"/>
      <ellipse cx="75" cy="20" rx="75" ry="24" fill="#0f172a" stroke="#00f2fe" stroke-width="2.5"/>
      
      <!-- Inner Radiant Energy Disc -->
      <ellipse cx="75" cy="20" rx="55" ry="17" fill="url(#cyan-blue-grad)" fill-opacity="0.3" filter="url(#core-glow)"/>
      <ellipse cx="75" cy="20" rx="28" ry="8" fill="#ffffff" fill-opacity="0.8" filter="url(#core-glow)"/>

      <!-- Status Data Ring Indicators on Database Flank -->
      <line x1="25" y1="45" x2="25" y2="165" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      <line x1="125" y1="45" x2="125" y2="165" stroke="#818cf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      
      <!-- O(1) Speed Lightning Glyph across DB -->
      <g transform="translate(42, 45)">
        <path d="M 38 -5 L 18 38 L 36 38 L 28 72 L 52 26 L 34 26 Z" fill="url(#amber-grad)" stroke="#ffffff" stroke-width="1.2" filter="url(#core-glow)"/>
      </g>
    </g>

    <!-- Bottom Brand Title Typography inside Hero Frame -->
    <text x="220" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#f8fafc" letter-spacing="1.5" text-anchor="middle">FASTMCP-SQLITE</text>
    <text x="220" y="400" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="3" text-anchor="middle">ZERO-DEPENDENCY · O(1) MCP</text>
  </g>
</svg>
