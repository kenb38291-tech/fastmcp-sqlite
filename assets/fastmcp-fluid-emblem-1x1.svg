<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" style="background:#03050a;font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI','Geist Mono',Roboto,sans-serif;">
  <defs>
    <!-- Multi-Stop Fluid Swirl Watercolor Gradients -->
    <radialGradient id="e-deepAura" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f1936"/>
      <stop offset="50%" stop-color="#090e20"/>
      <stop offset="100%" stop-color="#03050a"/>
    </radialGradient>

    <!-- Swirl Arm 1: Electric Cyan to Mint -->
    <linearGradient id="e-swirl1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Swirl Arm 2: Deep Indigo to Electric Violet -->
    <linearGradient id="e-swirl2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="40%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Swirl Arm 3: Radiant Amber to Sunset Rose -->
    <linearGradient id="e-swirl3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>

    <!-- Squircle Glass Bevel Rim -->
    <linearGradient id="e-squircleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="e-topGlassReflection" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Monolith Gradients -->
    <linearGradient id="e-monolithFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="e-monolithSide" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#022C22" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Shader Filters -->
    <filter id="e-grain" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="desat"/>
      <feComponentTransfer in="desat" result="alphaNoise">
        <feFuncA type="table" tableValues="0 0.12"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="alphaNoise" mode="overlay"/>
    </filter>

    <filter id="e-squircleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <filter id="e-hyperGlow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="16" result="blurMain"/>
      <feGaussianBlur stdDeviation="4" result="blurSharp"/>
      <feMerge>
        <feMergeNode in="blurMain"/>
        <feMergeNode in="blurSharp"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="e-mist" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="28"/>
    </filter>

    <!-- Continuous G2 Squircle Clip Path -->
    <clipPath id="e-squircleClip">
      <rect x="40" y="40" width="432" height="432" rx="96"/>
    </clipPath>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="512" height="512" fill="url(#e-deepAura)"/>

  <!-- Sub-pixel Calibration Marks (Swiss Geometry Coordinates) -->
  <g fill="#334155" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="700" letter-spacing="1">
    <text x="24" y="24">FASTMCP-SQLITE</text>
    <text x="440" y="24">512×512</text>
    <text x="24" y="498">OKLCH: P3</text>
    <text x="424" y="498">MCP V1.0</text>
  </g>

  <!-- ======================================================== -->
  <!-- SQUIRCLE APP ICON CONTAINER WITH GLASS BEVEL RIM         -->
  <!-- ======================================================== -->
  <g filter="url(#e-squircleShadow)">
    <!-- Squircle Background Tile -->
    <rect x="40" y="40" width="432" height="432" rx="96" fill="#070A14"/>

    <!-- Nested Content Inside Squircle Clip -->
    <g clip-path="url(#e-squircleClip)">
      <!-- Deep Internal Nebula Gradient -->
      <radialGradient id="e-nebulaIn" cx="50%" cy="50%" r="65%">
        <stop offset="0%" stop-color="#141E3C"/>
        <stop offset="60%" stop-color="#0B1024"/>
        <stop offset="100%" stop-color="#04060C"/>
      </radialGradient>
      <rect x="40" y="40" width="432" height="432" fill="url(#e-nebulaIn)"/>

      <!-- ======================================================== -->
      <!-- FLUID WATERCOLOR VORTEX SWIRL PETALS (ANALOG LIQUID FLOW) -->
      <!-- ======================================================== -->
      
      <!-- Translucent Diffused Background Swirls -->
      <g opacity="0.65" filter="url(#e-mist)">
        <path d="M 256,256 C 160,120 320,60 420,160 C 500,240 440,380 340,420 C 240,460 100,380 120,240 C 140,120 280,100 256,256 Z" fill="url(#e-swirl1)"/>
        <path d="M 256,256 C 360,380 200,440 120,340 C 40,240 120,120 220,80 C 320,40 440,140 420,280 C 400,380 280,380 256,256 Z" fill="url(#e-swirl3)" opacity="0.7"/>
        <path d="M 256,256 C 140,320 100,180 180,100 C 260,20 400,80 440,200 C 480,320 360,440 240,420 C 140,400 180,280 256,256 Z" fill="url(#e-swirl2)" opacity="0.8"/>
      </g>

      <!-- Crisp Surface Fluid Wave Swirl Ribbons -->
      <g filter="url(#e-hyperGlow)" opacity="0.9">
        <!-- Cyan-Mint Swirl Arm -->
        <path d="M 90,320 C 120,160 280,80 400,160 C 480,220 450,370 350,410 C 270,440 150,380 160,270 C 170,180 260,150 330,190" fill="none" stroke="url(#e-swirl1)" stroke-width="4.5" stroke-linecap="round"/>
        
        <!-- Warm Amber-Rose Swirl Arm -->
        <path d="M 430,200 C 400,360 240,440 120,360 C 40,300 70,150 170,110 C 250,80 370,140 360,250 C 350,340 260,370 190,330" fill="none" stroke="url(#e-swirl3)" stroke-width="3.5" stroke-linecap="round"/>

        <!-- Violet-Indigo Counter Accent Stream -->
        <path d="M 160,120 C 300,60 440,180 420,320 C 400,420 280,450 180,410 C 100,370 90,260 140,190" fill="none" stroke="url(#e-swirl2)" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
      </g>

      <!-- Orbital MCP Particle Satellites -->
      <g transform="translate(256, 256) rotate(-24)">
        <ellipse cx="0" cy="0" rx="145" ry="46" fill="none" stroke="#00F0FF" stroke-width="1.2" stroke-dasharray="6 10" opacity="0.6"/>
        <ellipse cx="0" cy="0" rx="168" ry="54" fill="none" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3 7" opacity="0.5"/>
        
        <circle cx="145" cy="0" r="4" fill="#FFFFFF" filter="url(#e-hyperGlow)"/>
        <circle cx="-130" cy="-18" r="3" fill="#00F0FF" filter="url(#e-hyperGlow)"/>
        <circle cx="60" cy="42" r="3" fill="#10B981" filter="url(#e-hyperGlow)"/>
        <circle cx="-70" cy="38" r="2.5" fill="#F59E0B" filter="url(#e-hyperGlow)"/>
      </g>

      <!-- ======================================================== -->
      <!-- CENTER EMBLEM: CRYSTALLINE SQLITE MONOLITH & LIGHTNING   -->
      <!-- ======================================================== -->
      <g transform="translate(256, 245)" filter="url(#e-hyperGlow)">
        <!-- Top Prismatic Diamond Cap -->
        <polygon points="0,-72 65,-34 0,4 -65,-34" fill="url(#e-monolithFront)"/>

        <!-- Left Cyan Glass Facet -->
        <polygon points="-65,-34 0,4 0,82 -65,44" fill="url(#e-monolithFront)" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.8"/>

        <!-- Right Emerald Glass Facet -->
        <polygon points="0,4 65,-34 65,44 0,82" fill="url(#e-monolithSide)" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.9"/>

        <!-- Internal Glowing Atomic WAL Spark -->
        <ellipse cx="0" cy="4" rx="24" ry="11" fill="#FFFFFF" opacity="0.95" filter="url(#e-hyperGlow)"/>
        <ellipse cx="0" cy="4" rx="12" ry="5" fill="#00F0FF" filter="url(#e-hyperGlow)"/>

        <!-- SQLite Kinetic Chevron Accent -->
        <polygon points="8,-24 22,-24 -8,38 -22,38" fill="url(#e-swirl3)" filter="url(#e-hyperGlow)"/>

        <!-- Axis Beam -->
        <line x1="0" y1="-50" x2="0" y2="60" stroke="#FFFFFF" stroke-width="2" filter="url(#e-hyperGlow)"/>

        <!-- Facet Edge Highlights -->
        <line x1="-65" y1="-34" x2="0" y2="4" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
        <line x1="0" y1="4" x2="65" y2="-34" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
      </g>

      <!-- Glass Top-Arch Highlight Sheen -->
      <path d="M 40,40 L 472,40 C 472,140 370,180 256,180 C 142,180 40,140 40,40 Z" fill="url(#e-topGlassReflection)" opacity="0.7"/>

      <!-- Micro Brand Wordmark at Bottom of Tile -->
      <text x="256" y="442" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="900" letter-spacing="3.5" fill="#94A3B8">
        FASTMCP<tspan fill="#10B981"> · SQLITE</tspan>
      </text>
    </g>

    <!-- Outer Squircle Bevel Rim Strokes -->
    <rect x="40" y="40" width="432" height="432" rx="96" fill="none" stroke="url(#e-squircleBorder)" stroke-width="2.5"/>
    <rect x="42" y="42" width="428" height="428" rx="94" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.2"/>
  </g>

  <!-- Tactile Analog Film Grain Layer Overlay -->
  <rect width="512" height="512" filter="url(#e-grain)" opacity="0.32" pointer-events="none"/>
</svg>