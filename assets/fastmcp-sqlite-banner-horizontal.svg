<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" style="background:#08090d;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Geist Mono','JetBrains Mono',monospace;">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b26" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1.5" fill="#222f3e" opacity="0.8"/>
    </pattern>

    <!-- Gradients -->
    <linearGradient id="emeraldCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="sqliteGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <radialGradient id="bgGlow" cx="30%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.12"/>
      <stop offset="40%" stop-color="#06B6D4" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#08090d" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="topRightGlow" cx="85%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#08090d" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1280" height="640" fill="#08090d"/>
  <rect width="1280" height="640" fill="url(#bgGlow)"/>
  <rect width="1280" height="640" fill="url(#topRightGlow)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- Subtle Accent Lines -->
  <line x1="0" y1="639" x2="1280" y2="639" stroke="#1E293B" stroke-width="1"/>
  <line x1="0" y1="0" x2="1280" y2="0" stroke="#1E293B" stroke-width="1"/>

  <!-- BRAND ICON (LEFT LOCKUP) -->
  <g transform="translate(140, 180)" filter="url(#softShadow)">
    <!-- Outer Glow Aura -->
    <circle cx="140" cy="140" r="130" fill="#10B981" opacity="0.05" filter="url(#glow)"/>

    <!-- Database Disc Base Tier 3 -->
    <path d="M 40 180 C 40 210, 240 210, 240 180 L 240 215 C 240 245, 40 245, 40 215 Z" fill="#0F172A" stroke="#334155" stroke-width="2.5"/>
    <path d="M 40 180 C 40 210, 240 210, 240 180" fill="none" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Database Disc Mid Tier 2 -->
    <path d="M 40 120 C 40 150, 240 150, 240 120 L 240 155 C 240 185, 40 185, 40 155 Z" fill="#131F37" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.8"/>
    <ellipse cx="140" cy="120" rx="100" ry="28" fill="#1E293B" stroke="#475569" stroke-width="2"/>

    <!-- Database Disc Top Tier 1 -->
    <path d="M 40 60 C 40 90, 240 90, 240 60 L 240 95 C 240 125, 40 125, 40 95 Z" fill="#1E293B" stroke="#10B981" stroke-width="2.5"/>
    <ellipse cx="140" cy="60" rx="100" ry="28" fill="#0F172A" stroke="#10B981" stroke-width="3" filter="url(#glow)"/>
    <ellipse cx="140" cy="60" rx="80" ry="20" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="8 4"/>

    <!-- Dynamic Kinetic Lightning Slash (FastMCP Speed Metaphor) -->
    <polygon points="175,10 115,135 155,135 95,270 205,115 155,115" fill="url(#emeraldCyan)" filter="url(#glow)"/>
    <polygon points="170,25 125,130 155,130 110,250 190,120 152,120" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- BRAND TYPOGRAPHY (RIGHT LOCKUP) -->
  <g transform="translate(480, 220)">
    <!-- Protocol Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="186" height="28" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
      <circle cx="14" cy="14" r="4" fill="#10B981" filter="url(#glow)"/>
      <text x="28" y="18" fill="#38BDF8" font-size="12" font-weight="700" letter-spacing="1.5">MCP PROTOCOL 1.0</text>
    </g>

    <!-- Main Wordmark -->
    <g transform="translate(0, 75)">
      <text x="0" y="0" font-size="64" font-weight="800" letter-spacing="-1.5" fill="#FFFFFF">fastmcp<tspan fill="url(#sqliteGrad)">-sqlite</tspan></text>
    </g>

    <!-- Subtitle / Tagline -->
    <g transform="translate(0, 115)">
      <text x="0" y="0" font-size="20" font-weight="500" fill="#94A3B8" letter-spacing="0.2">
        High-Performance, Zero-Config SQLite Server for LLMs &amp; Agents
      </text>
    </g>

    <!-- Architectural Feature Badges -->
    <g transform="translate(0, 155)">
      <!-- Badge 1: O(1) Schema -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="175" height="34" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        <path d="M12 17 L16 21 L24 13" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
        <text x="32" y="21" fill="#E2E8F0" font-size="13" font-weight="600" letter-spacing="0.5">O(1) Schema Probe</text>
      </g>

      <!-- Badge 2: Watchdog Guard -->
      <g transform="translate(187, 0)">
        <rect x="0" y="0" width="180" height="34" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        <circle cx="18" cy="17" r="5" fill="none" stroke="#38BDF8" stroke-width="1.8"/>
        <path d="M18 14 L18 17 L20 19" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
        <text x="32" y="21" fill="#E2E8F0" font-size="13" font-weight="600" letter-spacing="0.5">Watchdog &lt;5ms Abort</text>
      </g>

      <!-- Badge 3: Tokenomics -->
      <g transform="translate(379, 0)">
        <rect x="0" y="0" width="175" height="34" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        <rect x="12" y="11" width="12" height="12" rx="2" fill="none" stroke="#A855F7" stroke-width="1.8"/>
        <text x="32" y="21" fill="#E2E8F0" font-size="13" font-weight="600" letter-spacing="0.5">24KB Token Ceiling</text>
      </g>
    </g>
  </g>

  <!-- Bottom Terminal Decorative Status Bar -->
  <g transform="translate(140, 560)">
    <line x1="0" y1="0" x2="1000" y2="0" stroke="#1E293B" stroke-width="1"/>
    <text x="0" y="24" fill="#64748B" font-size="12" font-weight="500" letter-spacing="0.5">ENGINE: Standard Library sqlite3 (Zero C++ Build)</text>
    <text x="500" y="24" fill="#64748B" font-size="12" font-weight="500" letter-spacing="0.5">WAL MODE: PRAGMA journal_mode=WAL</text>
    <text x="890" y="24" fill="#10B981" font-size="12" font-weight="700" letter-spacing="1">● READY v1.0.0</text>
  </g>
</svg>
